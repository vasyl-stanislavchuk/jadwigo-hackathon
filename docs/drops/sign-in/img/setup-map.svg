<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="setup-map-title setup-map-desc" id="setup-map-root">
        <title id="setup-map-title">Where the setup lives, and who sets it</title>
        <desc id="setup-map-desc">The owner creates the Google and Facebook apps and keeps their secrets in the keychain, agents keep the client ids and the web buttons in the repo, and auth.sh applies both to Supabase.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #setup-map-root { --color-paper:   #fbfcfe;
      --color-ink:     #040810;
      --color-muted:   #5a6b85;
      --color-accent:  #2941f3;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-display:  'Space Grotesk', 'Inter', system-ui, sans-serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #setup-map-root { font-family: var(--font-sans); color: var(--color-ink); }
      #setup-map-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#setup-map-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="setup-map-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a6b85"/></marker>
          <marker id="setup-map-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2941f3"/></marker>
          <marker id="setup-map-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0f7f76"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#fbfcfe"/>

        <!-- ============ ZONES ============ -->
        <rect x="40" y="88" width="896" height="268" rx="12" fill="#040810" stroke="#040810" stroke-width="0.8" fill-opacity="0.015" stroke-opacity="0.07"/>
        <rect x="52" y="92" width="132" height="12" rx="2" fill="#fbfcfe"/>
        <text x="118" y="101" fill="#7888a0" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">THE OWNER SETS, BY HAND</text>

        <rect x="376" y="396" width="560" height="196" rx="12" fill="#040810" stroke="#040810" stroke-width="0.8" fill-opacity="0.015" stroke-opacity="0.07"/>
        <rect x="388" y="400" width="120" height="12" rx="2" fill="#fbfcfe"/>
        <text x="448" y="409" fill="#7888a0" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">AGENTS BUILD, IN A PR</text>

        <!-- ============ CALLOUT ============ -->
        <text x="408" y="56" fill="#040810" font-size="14" font-style="italic" font-family="'Inter', system-ui, sans-serif">Secrets go from the provider console to the keychain, never through a file in git.</text>
        <path d="M 424,66 Q 424,120 448,136" fill="none" stroke="#040810" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.40"/>
        <circle cx="448" cy="136" r="2" fill="#040810"/>

        <!-- ============ ARROWS ============ -->
        <!-- Google -> keychain -->
        <path d="M 312,152 H 408" fill="none" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#setup-map-arrow)"/>
        <!-- Google -> json -->
        <path d="M 312,184 H 336 Q 344,184 344,192 V 448 Q 344,456 352,456 H 408" fill="none" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#setup-map-arrow)"/>
        <!-- Meta -> keychain (hops over Google -> json) -->
        <path d="M 312,272 H 336 a 8,8 0 0,1 16,0 H 464 Q 472,272 472,264 V 200" fill="none" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#setup-map-arrow)"/>
        <!-- Meta -> json -->
        <path d="M 192,328 V 476 Q 192,484 200,484 H 408" fill="none" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#setup-map-arrow)"/>
        <!-- keychain -> auth.sh -->
        <path d="M 648,168 H 712" fill="none" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#setup-map-arrow)"/>
        <!-- json -> auth.sh -->
        <path d="M 648,472 H 768 Q 776,472 776,464 V 208" fill="none" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#setup-map-arrow)"/>
        <!-- auth.sh -> Supabase Auth (Management API) -->
        <path d="M 912,168 H 944 Q 952,168 952,176 V 312 Q 952,320 960,320 H 992" fill="none" stroke="#0f7f76" stroke-width="1.2" marker-end="url(#setup-map-arrow-link)"/>
        <!-- apps/web -> Supabase Auth -->
        <path d="M 912,528 H 960 Q 968,528 968,520 V 360 Q 968,352 976,352 H 992" fill="none" stroke="#0f7f76" stroke-width="1.2" marker-end="url(#setup-map-arrow-link)"/>
        <!-- Supabase Auth -> AWS authorizer (passive) -->
        <path d="M 1112,376 V 456" fill="none" stroke="#5a6b85" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#setup-map-arrow)"/>

        <!-- ============ ARROW LABELS ============ -->
        <rect x="336" y="132" width="48" height="12" rx="2" fill="#fbfcfe"/>
        <text x="360" y="141" fill="#5a6b85" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SECRET</text>

        <rect x="352" y="368" width="56" height="12" rx="2" fill="#fbfcfe"/>
        <text x="380" y="377" fill="#5a6b85" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CLIENT ID</text>

        <rect x="480" y="224" width="48" height="12" rx="2" fill="#fbfcfe"/>
        <text x="504" y="233" fill="#5a6b85" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SECRET</text>

        <rect x="248" y="464" width="48" height="12" rx="2" fill="#fbfcfe"/>
        <text x="272" y="473" fill="#5a6b85" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">APP ID</text>

        <rect x="660" y="148" width="40" height="12" rx="2" fill="#fbfcfe"/>
