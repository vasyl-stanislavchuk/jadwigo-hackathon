        <rect x="712" y="488" width="200" height="80" rx="6" fill="#fbfcfe"/>
        <rect x="712" y="488" width="200" height="80" rx="6" fill="#ffffff" stroke="#5a6b85" stroke-width="1"/>
        <rect x="724" y="498" width="32" height="12" rx="2" fill="none" stroke="#5a6b85" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="740" y="507" fill="#5a6b85" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">REPO</text>
        <text x="812" y="530" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Parent sign-in</text>
        <text x="812" y="546" fill="#5a6b85" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">apps/web /parent</text>
        <text x="812" y="558" fill="#5a6b85" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">buttons, code exchange</text>

