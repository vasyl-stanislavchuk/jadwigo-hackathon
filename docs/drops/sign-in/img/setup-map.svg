        <rect x="408" y="432" width="240" height="80" rx="6" fill="#fbfcfe"/>
        <rect x="408" y="432" width="240" height="80" rx="6" fill="#5a6b85" stroke="#667997" stroke-width="1" fill-opacity="0.08"/>
        <rect x="420" y="442" width="32" height="12" rx="2" fill="none" stroke="#667997" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="436" y="451" fill="#5a6b85" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">REPO</text>
        <text x="528" y="474" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Provider config</text>
        <text x="528" y="490" fill="#5a6b85" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">infra/supabase-auth/{dev,prod}.json</text>
        <text x="528" y="502" fill="#5a6b85" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">client ids, enabled flags</text>

