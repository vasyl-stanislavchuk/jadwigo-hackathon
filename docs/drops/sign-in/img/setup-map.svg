        <text x="804" y="333" fill="#5a6b85" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">READS</text>

        <rect x="960" y="236" width="76" height="12" rx="2" fill="#fbfcfe"/>
        <text x="998" y="245" fill="#5a6b85" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PATCH CONFIG</text>

        <rect x="920" y="436" width="40" height="12" rx="2" fill="#fbfcfe"/>
        <text x="940" y="445" fill="#5a6b85" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">OAUTH</text>

        <rect x="1120" y="410" width="72" height="12" rx="2" fill="#fbfcfe"/>
        <text x="1156" y="419" fill="#5a6b85" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SAME TOKENS</text>

        <!-- ============ NODES ============ -->
        <!-- Google Cloud (external) -->
        <rect x="72" y="128" width="240" height="80" rx="6" fill="#fbfcfe"/>
        <rect x="72" y="128" width="240" height="80" rx="6" fill="#ffffff" stroke="#7888a0" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="84" y="138" width="72" height="12" rx="2" fill="none" stroke="#7888a0" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="120" y="147" fill="#5a6b85" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">GOOGLE CLOUD</text>
        <text x="192" y="170" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">OAuth client per environment</text>
        <text x="192" y="186" fill="#5a6b85" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">consent screen, branding,</text>
        <text x="192" y="198" fill="#5a6b85" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">redirect URI</text>

        <!-- Meta for Developers (external) -->
        <rect x="72" y="248" width="240" height="80" rx="6" fill="#fbfcfe"/>
        <rect x="72" y="248" width="240" height="80" rx="6" fill="#ffffff" stroke="#7888a0" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="84" y="258" width="108" height="12" rx="2" fill="none" stroke="#7888a0" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="138" y="267" fill="#5a6b85" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">META FOR DEVELOPERS</text>
        <text x="192" y="290" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Facebook app</text>
        <text x="192" y="306" fill="#5a6b85" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Facebook Login, email + public_profile</text>
        <text x="192" y="318" fill="#5a6b85" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">testers, review</text>

        <!-- macOS keychain (store) -->
        <rect x="408" y="136" width="240" height="64" rx="6" fill="#fbfcfe"/>
        <rect x="408" y="136" width="240" height="64" rx="6" fill="#5a6b85" stroke="#667997" stroke-width="1" fill-opacity="0.08"/>
        <rect x="420" y="146" width="88" height="12" rx="2" fill="none" stroke="#667997" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="464" y="155" fill="#5a6b85" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">MACOS KEYCHAIN</text>
        <text x="528" y="176" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Client secrets</text>
        <text x="528" y="190" fill="#5a6b85" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">never in git</text>

        <!-- auth.sh apply (step) -->
        <rect x="712" y="128" width="200" height="80" rx="6" fill="#fbfcfe"/>
        <rect x="712" y="128" width="200" height="80" rx="6" fill="#ffffff" stroke="#5a6b85" stroke-width="1"/>
        <rect x="724" y="138" width="80" height="12" rx="2" fill="none" stroke="#5a6b85" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="764" y="147" fill="#5a6b85" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">OWNER RUNS</text>
        <text x="812" y="170" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Apply script</text>
        <text x="812" y="186" fill="#5a6b85" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">infra/supabase-auth/</text>
        <text x="812" y="198" fill="#5a6b85" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">auth.sh apply</text>

        <!-- Supabase Auth (focal) -->
        <rect x="992" y="296" width="240" height="80" rx="6" fill="#fbfcfe"/>
        <rect x="992" y="296" width="240" height="80" rx="6" fill="#2941f3" stroke="#2941f3" stroke-width="1.5" fill-opacity="0.10"/>
        <rect x="1004" y="306" width="28" height="12" rx="2" fill="none" stroke="#2941f3" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="1018" y="315" fill="#2941f3" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HUB</text>
        <text x="1112" y="338" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Supabase Auth</text>
        <text x="1112" y="354" fill="#5a6b85" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">jadwigo-dev, jadwigo-prod</text>
        <text x="1112" y="366" fill="#5a6b85" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">providers on, redirect allow list</text>

