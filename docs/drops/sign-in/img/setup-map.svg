        <rect x="992" y="456" width="240" height="80" rx="6" fill="#040810" stroke="#7888a0" stroke-width="1" stroke-dasharray="2,3" fill-opacity="0.02"/>
        <rect x="1004" y="466" width="28" height="12" rx="2" fill="none" stroke="#7888a0" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="1018" y="475" fill="#5a6b85" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">AWS</text>
        <text x="1112" y="498" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">API Gateway JWT authorizer</text>
        <text x="1112" y="514" fill="#5a6b85" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">unchanged</text>
        <text x="1112" y="526" fill="#5a6b85" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">RS256, same issuer</text>

