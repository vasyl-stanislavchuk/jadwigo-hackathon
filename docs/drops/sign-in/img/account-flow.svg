<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="account-flow-title account-flow-desc" id="account-flow-root">
        <title id="account-flow-title">Which parent a Google or Facebook sign-in becomes</title>
        <desc id="account-flow-desc">Supabase links a provider sign-in to the parent who already has that verified email, refuses one with no email, and otherwise makes a new parent.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #account-flow-root { --color-paper:   #fbfcfe;
      --color-ink:     #040810;
      --color-muted:   #5a6b85;
      --color-accent:  #2941f3;
      --font-display:  'Space Grotesk', system-ui, sans-serif;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #account-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #account-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#account-flow-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="account-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a6b85"/></marker>
          <marker id="account-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2941f3"/></marker>
          <marker id="account-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0f7f76"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#fbfcfe"/>

        <!-- Arrows (drawn first, behind nodes) -->
        <!-- Start -> D1 -->
        <line x1="520" y1="88" x2="520" y2="112" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#account-flow-arrow)"/>
        <!-- D1 NO -> our page -->
        <line x1="440" y1="160" x2="320" y2="160" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#account-flow-arrow)"/>
        <!-- D1 YES -> D2 -->
        <line x1="520" y1="208" x2="520" y2="248" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#account-flow-arrow)"/>
        <!-- D2 NO -> unlinked user -->
        <line x1="440" y1="296" x2="320" y2="296" stroke="#5a6b85" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#account-flow-arrow)"/>
        <!-- D2 YES -> D3 -->
        <line x1="520" y1="344" x2="520" y2="384" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#account-flow-arrow)"/>
        <!-- D3 YES -> linked -->
        <line x1="600" y1="432" x2="656" y2="432" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#account-flow-arrow)"/>
        <!-- linked -> same account -->
        <line x1="896" y1="432" x2="928" y2="432" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#account-flow-arrow)"/>
        <!-- D3 NO -> new user -->
        <line x1="520" y1="480" x2="520" y2="528" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#account-flow-arrow)"/>

        <!-- Arrow labels (masked, 8px gap from their stroke) -->
        <rect x="346" y="140" width="68" height="12" rx="2" fill="#fbfcfe"/>
        <text x="380" y="149" fill="#5a6b85" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO · REFUSED</text>

        <rect x="528" y="222" width="28" height="12" rx="2" fill="#fbfcfe"/>
        <text x="542" y="231" fill="#5a6b85" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

        <rect x="368" y="276" width="24" height="12" rx="2" fill="#fbfcfe"/>
        <text x="380" y="285" fill="#5a6b85" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

        <rect x="528" y="358" width="28" height="12" rx="2" fill="#fbfcfe"/>
        <text x="542" y="367" fill="#5a6b85" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

        <rect x="614" y="412" width="28" height="12" rx="2" fill="#fbfcfe"/>
        <text x="628" y="421" fill="#5a6b85" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

        <rect x="528" y="498" width="24" height="12" rx="2" fill="#fbfcfe"/>
        <text x="540" y="507" fill="#5a6b85" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

        <!-- Start oval -->
        <rect x="400" y="40" width="240" height="48" rx="20" fill="#fbfcfe"/>
        <rect x="400" y="40" width="240" height="48" rx="20" fill="#ffffff" stroke="#7888a0" stroke-width="1"/>
        <text x="520" y="68" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Back from Google or Facebook</text>

        <!-- D1: Email returned? -->
        <polygon points="520,112 600,160 520,208 440,160" fill="#ffffff" stroke="#5a6b85" stroke-width="1"/>
        <text x="520" y="164" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Email returned?</text>

        <!-- Our page (focal 1) -->
        <rect x="80" y="132" width="240" height="56" rx="6" fill="#fbfcfe"/>
        <rect x="80" y="132" width="240" height="56" rx="6" fill="#2941f3" stroke="#2941f3" stroke-width="1.5" fill-opacity="0.10"/>
        <text x="200" y="156" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Our page: a kind message</text>
        <text x="200" y="174" fill="#5a6b85" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">offers the email code</text>

        <!-- D2: Email verified? -->
        <polygon points="520,248 600,296 520,344 440,296" fill="#ffffff" stroke="#5a6b85" stroke-width="1"/>
        <text x="520" y="300" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Email verified?</text>
        <text x="616" y="292" fill="#5a6b85" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Google: email_verified claim</text>
        <text x="616" y="306" fill="#5a6b85" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Facebook: always verified</text>

        <!-- New Supabase user, not linked (rare) -->
        <rect x="80" y="268" width="240" height="56" rx="6" fill="#fbfcfe"/>
        <rect x="80" y="268" width="240" height="56" rx="6" fill="#040810" stroke="#7888a0" stroke-width="1" stroke-dasharray="2,3" fill-opacity="0.02"/>
        <text x="200" y="292" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">New Supabase user, not linked</text>
        <text x="200" y="310" fill="#5a6b85" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">rare; Google only</text>

        <!-- D3: A user with this email? -->
        <polygon points="520,384 600,432 520,480 440,432" fill="#ffffff" stroke="#5a6b85" stroke-width="1"/>
        <text x="520" y="429" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">A user with</text>
        <text x="520" y="444" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">this email?</text>

        <!-- Identity linked -->
        <rect x="656" y="404" width="240" height="56" rx="6" fill="#fbfcfe"/>
        <rect x="656" y="404" width="240" height="56" rx="6" fill="#ffffff" stroke="#5a6b85" stroke-width="1"/>
        <text x="776" y="428" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Identity linked to that user</text>
        <text x="776" y="446" fill="#5a6b85" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">verified email matches</text>

        <!-- Same account (focal 2) -->
        <rect x="928" y="404" width="240" height="56" rx="6" fill="#fbfcfe"/>
        <rect x="928" y="404" width="240" height="56" rx="6" fill="#2941f3" stroke="#2941f3" stroke-width="1.5" fill-opacity="0.10"/>
        <text x="1048" y="428" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Same account, same pod</text>
        <text x="1048" y="446" fill="#5a6b85" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">same sub</text>

        <!-- New user, new sub -->
        <rect x="400" y="528" width="240" height="56" rx="6" fill="#fbfcfe"/>
        <rect x="400" y="528" width="240" height="56" rx="6" fill="#ffffff" stroke="#5a6b85" stroke-width="1"/>
        <text x="520" y="552" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">New user, new sub</text>
        <text x="520" y="570" fill="#5a6b85" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">POST /accounts: pod, account, member</text>

        <!-- Callout -->
        <text x="1168" y="316" fill="#040810" font-size="14" font-style="italic" font-family="'Inter', system-ui, sans-serif" text-anchor="end">A parent who signed up with the email code</text>
        <text x="1168" y="336" fill="#040810" font-size="14" font-style="italic" font-family="'Inter', system-ui, sans-serif" text-anchor="end">and later taps Google keeps the same account.</text>
        <path d="M 1120 346 Q 1104 376 1096 404" fill="none" stroke="#040810" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.40"/>
        <circle cx="1096" cy="404" r="2" fill="#040810"/>

        <!-- Legend -->
        <line x1="40" y1="624" x2="1240" y2="624" stroke="#040810" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="644" fill="#5a6b85" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="40" y="660" width="24" height="12" rx="6" fill="#ffffff" stroke="#7888a0" stroke-width="1"/>
        <text x="72" y="670" fill="#5a6b85" font-size="9" font-family="'Inter', system-ui, sans-serif">Start</text>

        <rect x="160" y="660" width="24" height="12" rx="2" fill="#ffffff" stroke="#5a6b85" stroke-width="1"/>
        <text x="192" y="670" fill="#5a6b85" font-size="9" font-family="'Inter', system-ui, sans-serif">Outcome</text>

        <polygon points="300,666 312,660 324,666 312,672" fill="#ffffff" stroke="#5a6b85" stroke-width="1"/>
        <text x="336" y="670" fill="#5a6b85" font-size="9" font-family="'Inter', system-ui, sans-serif">Decision (Supabase Auth)</text>

        <rect x="496" y="660" width="24" height="12" rx="2" fill="#2941f3" stroke="#2941f3" stroke-width="1.5" fill-opacity="0.10"/>
        <text x="528" y="670" fill="#5a6b85" font-size="9" font-family="'Inter', system-ui, sans-serif">What the parent meets</text>

        <rect x="680" y="660" width="24" height="12" rx="2" fill="#040810" stroke="#7888a0" stroke-width="1" stroke-dasharray="2,3" fill-opacity="0.02"/>
        <text x="712" y="670" fill="#5a6b85" font-size="9" font-family="'Inter', system-ui, sans-serif">Rare path</text>
      </svg>
