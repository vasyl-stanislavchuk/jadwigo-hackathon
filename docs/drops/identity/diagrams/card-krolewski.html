<style>

*{box-sizing:border-box}
html,body{margin:0;width:720px;min-height:640px;background:#ffffff}
body{font-family:Andika,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:16px;font-weight:700;border:0;cursor:default}
.chip{display:inline-block;border-radius:9999px;padding:6px 14px;font-size:15px;border:2px solid}

<body>
<div style="width:720px;height:640px;background:#fff;color:#22252d;display:flex;flex-direction:column">
<div style="height:72px;display:flex;align-items:center;gap:20px;padding:0 24px;border-bottom:2px solid #e8e2d5">
<span style="font-size:28px;color:#50535c">×</span>
<div style="flex:1;display:flex;justify-content:center"><div style="display:flex;gap:6px"><span style="width:36px;height:8px;border-radius:9999px;background:#3a5fa8"></span><span style="width:36px;height:8px;border-radius:9999px;background:#3a5fa8"></span><span style="width:36px;height:8px;border-radius:9999px;background:#3a5fa8"></span><span style="width:36px;height:8px;border-radius:9999px;background:#e8e2d5"></span><span style="width:36px;height:8px;border-radius:9999px;background:#e8e2d5"></span><span style="width:36px;height:8px;border-radius:9999px;background:#e8e2d5"></span><span style="width:36px;height:8px;border-radius:9999px;background:#e8e2d5"></span><span style="width:36px;height:8px;border-radius:9999px;background:#e8e2d5"></span><span style="width:36px;height:8px;border-radius:9999px;background:#e8e2d5"></span></div></div>
<span style="min-width:30px;display:flex;justify-content:flex-end"><svg viewBox="0 0 64 64" width="30" height="30" aria-hidden="true"><path d="M32 30c0-8 4-13 10-15-1 7-4 11-10 15z" fill="#2a4ea0"/><path d="M32 30c0-6-3-10-8-12 1 6 3 9 8 12z" fill="#2a4ea0"/><path d="M32 30v8" stroke="#2a4ea0" stroke-width="2.4" stroke-linecap="round"/><path d="M10 52l-2-18 11 8 6-12 7 10 7-10 6 12 11-8-2 18z" fill="#ad7f1f"/><path d="M10 52h44v5H10z" fill="#ad7f1f"/><circle cx="20" cy="47" r="2.2" fill="#fff"/><circle cx="32" cy="47" r="2.2" fill="#fff"/><circle cx="44" cy="47" r="2.2" fill="#fff"/></svg></span>
</div>
<div style="padding:24px 24px 0;flex:1">
<div style="font-weight:700;font-size:22px;margin-bottom:16px">Wybierz wynik.</div>
<div style="border:2px solid #e8e2d5;border-radius:16px;padding:20px;font-size:36px;display:flex;justify-content:space-between;align-items:center"><span>6 × 7 = ?</span><span style="font-size:15px;color:#50535c;border:2px solid #e8e2d5;border-radius:9999px;padding:6px 12px">posłuchaj</span></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px"><span style="display:flex;align-items:center;justify-content:center;height:72px;border-radius:16px;font-size:26px;border:2px solid #2f63b8;background:#dce8fb;color:#163a78;box-shadow:0 4px 0 #2f63b8">42</span><span style="display:flex;align-items:center;justify-content:center;height:72px;border-radius:16px;font-size:26px;border:2px solid #e8e2d5;background:#fff;color:#22252d;box-shadow:0 4px 0 #e8e2d5">48</span><span style="display:flex;align-items:center;justify-content:center;height:72px;border-radius:16px;font-size:26px;border:2px solid #e8e2d5;background:#fff;color:#22252d;box-shadow:0 4px 0 #e8e2d5">36</span><span style="display:flex;align-items:center;justify-content:center;height:72px;border-radius:16px;font-size:26px;border:2px solid #e8e2d5;background:#fff;color:#22252d;box-shadow:0 4px 0 #e8e2d5">13</span></div>
</div>
<div style="height:96px;border-top:2px solid #e8e2d5;display:flex;align-items:center;gap:12px;padding:0 24px">
<span class="btn" style="height:64px;padding:0 20px;font-size:20px;background:#fbf1d2;color:#5a4300;box-shadow:0 4px 0 #a07c14">Pomóż mi</span>
<span class="btn" style="flex:1;height:64px;font-size:22px;background:#9fbaeb;color:#0f285a;box-shadow:0 4px 0 #6585c2">Sprawdź</span>
</div>
</div>
