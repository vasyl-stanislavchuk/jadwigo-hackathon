# Pre-commit: Biome on the staged files and gitleaks on the staged diff. `bun install` installs it.
pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{ts,tsx,js,cjs,mjs,json,jsonc}"
      run: bunx biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    - name: gitleaks
      run: gitleaks git --staged --redact --no-banner --config .gitleaks.toml
