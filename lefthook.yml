# Pre-commit: Biome on the staged files and gitleaks on the staged diff. gitleaks is pinned in
# mise.toml and runs through `mise exec`, so a shell that never activated mise still finds it.
pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{ts,tsx,js,cjs,mjs,json,jsonc}"
      run: bunx biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    - name: gitleaks
      run: mise exec -- gitleaks git --staged --redact --no-banner --config .gitleaks.toml

# A merge, pull or branch switch that changes bun.lock reinstalls, so Biome and the rest of
# node_modules match the lockfile they now run against.
post-merge:
  jobs:
    - name: bun-install
      run: git diff --quiet ORIG_HEAD HEAD -- bun.lock 2>/dev/null || mise exec -- bun install --frozen-lockfile
post-rewrite:
  jobs:
    - name: bun-install
      run: git diff --quiet ORIG_HEAD HEAD -- bun.lock 2>/dev/null || mise exec -- bun install --frozen-lockfile
post-checkout:
  jobs:
    - name: bun-install
      # {3} is 1 for a branch checkout and 0 for a file checkout.
      run: test "{3}" = 0 || git diff --quiet {1} {2} -- bun.lock 2>/dev/null || mise exec -- bun install --frozen-lockfile
