# CI for jadwigo (dl-5ssh.34.3). Every PR push and every push to main. No paths: filter: the
# changes job decides what runs, and turbo --affected decides which packages. ci-ok gathers every
# job and is CI's one required check, so a skipped job never leaves the PR pending. The other
# required check, review-ok, is a commit status that md's merge steward posts.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      code: ${{ steps.diff.outputs.code }}
      workflows: ${{ steps.diff.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        name: Is anything outside docs changed?
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then base="$PR_BASE"; head="$PR_HEAD"; else base="$BEFORE"; head="$GITHUB_SHA"; fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "no usable base, so everything runs"; echo "code=true" >> "$GITHUB_OUTPUT"
            echo "workflows=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          code=false
          workflows=false
          while IFS= read -r f; do
            case "$f" in
              # The docs site's pages are its source: a .md under apps/docs is built (dl-5ssh.90.10).
              apps/docs/*) code=true; echo "docs site change: $f" ;;
              # A product workflow is .md, yet the cli's compose eval reads it (dl-5ssh.103).
              workflows/*) workflows=true; echo "workflow change: $f" ;;
              docs/*|*.md) ;;
              *) code=true; echo "code change: $f" ;;
            esac
          done < <(git diff --name-only "$base" "$head")
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "workflows=$workflows" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Biome per package (affected)
        run: bunx turbo run lint --affected
      - name: Biome on the root, knip, dependency-cruiser, no-bank, worklog
        run: bun run lint:repo

  typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bunx turbo run typecheck --affected

  # turbo --affected picks packages by the files inside them, so a change under workflows/ alone
  # picks none; the cli tests, whose compose eval reads workflows/, run by name then (dl-5ssh.103).
  unit:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - if: needs.changes.outputs.code == 'true'
        run: bunx turbo run test --affected
      - name: The cli tests and the workflow links, on a workflows/ change
        if: needs.changes.outputs.workflows == 'true'
        run: |
          bunx turbo run test --filter=@jadwigo/cli
          bun tools/src/check-workflows.ts

  integration:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://runner:runner@localhost:5433/jadwigo_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/postgres
      - run: make migrate
      - run: bunx turbo run test:int

  supabase:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://runner:runner@localhost:5433/jadwigo_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/postgres
      - name: Apply the shim and every migration (supabase/migrations)
        run: make migrate
      - name: pgTAP (supabase/tests)
        run: make pgtap

  contracts:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: JSON Schema snapshots (CI never writes them, so drift fails)
        run: bunx turbo run test --filter=@jadwigo/contracts

  docs:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: The guard's tests
        run: bun test ./.claude/hooks/guard.test.ts
      - name: The worklog layout
        run: bun tools/src/check-worklog.ts

  # docs.jadwigo.pl builds on every code change, not only when turbo calls apps/docs affected: its
  # pages read the openapi.json and mcp-tools.json snapshots as files, which --affected does not
  # follow. A broken link, a guide naming a route ROUTES lacks, or a stale snapshot fails here,
  # not at the owner's publish (dl-5ssh.90.10).
  docs-site:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build the docs site (links, generated pages, the API reference)
        run: bunx turbo run build --filter=@jadwigo/docs
      - name: Check what the build put in dist
        run: bun run --cwd apps/docs check:dist

  fence-checks:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The PR title names an issue id
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'renovate[bot]'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$TITLE" =~ ^dl-[a-z0-9]+(\.[0-9]+)*:\  ]]; then
            echo "::error::The PR title must start with an issue id, as in 'dl-5ssh.34.3: CI with the ci-ok gate'. Got: $TITLE"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          cache: true
      - name: No question bank in git
        run: bun tools/src/check-no-bank.ts
      - name: The PR body has the /dev-pr shape
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'renovate[bot]'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          bun tools/src/check-pr-body.ts || {
            echo "::error::Fix the body with gh pr edit --body-file. The edit starts a new run; a rerun of this one checks the old body again."
            exit 1
          }

  gitleaks:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks comes from mise.toml, the pin pre-commit uses, so Renovate moves one version.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: gitleaks
          cache: true
      - name: No secrets in the commits this run brings
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then base="$PR_BASE"; head="$PR_HEAD"; else base="$BEFORE"; head="$GITHUB_SHA"; fi
          if [ -n "$base" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            set -- "--log-opts=${base}..${head}"
          else
            echo "no usable base, so the whole history is scanned"; set --
          fi
          gitleaks git --redact --no-banner --config .gitleaks.toml "$@"

  # The browser smoke: apps/web built and served, played at 390 and 1280 (apps/web/e2e), and the
  # lesson player end to end against a local api on a seeded database (e2e/play.spec.ts, the `api`
  # project, dl-5ssh.46). Component tests run in the unit job (Vitest's dom project, happy-dom);
  # this is the one real browser.
  browser:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://runner:runner@localhost:5433/jadwigo_e2e
      JW_E2E_API: "1"
      JW_API_URL: http://127.0.0.1:8787
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/postgres
      - name: The e2e database, migrated and seeded with the featured lessons
        run: |
          PGPASSWORD=runner createdb -h localhost -p 5433 -U runner jadwigo_e2e
          make migrate
          make db-seed
      # On this CI database only: equal-groups' featured assignment asks a twin right after "Not
      # sure yet", which play.spec.ts plays through. The seed, and so every real database, keeps
      # `next`, which asks no twin.
      - name: Twin after "Not sure yet" on the e2e database (jadwigo_e2e only)
        run: |
          updated=$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "update assignment set after_not_sure = 'twin_now' where id = '0e66bf21-3b77-5a4a-a1ec-3b371dc97fc3' returning id")
          test -n "$updated" || { echo "::error::no featured equal-groups assignment to set twin_now on"; exit 1; }
      # The token routes verify against the JWKS of e2e/auth-server.ts, the Supabase Auth stand-in
      # playwright.config.ts starts; the api reads it on the first token, after Playwright is up.
      - name: The api on port 8787
        env:
          AUTH_JWKS_URL: http://127.0.0.1:54321/auth/v1/.well-known/jwks.json
          AUTH_ISSUER: http://127.0.0.1:54321/auth/v1
        run: |
          PORT=8787 nohup bun apps/api/src/serve.ts > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS "$JW_API_URL/api/v1/featured-lessons" >/dev/null && exit 0
            sleep 1
          done
          echo "::error::the api did not answer on $JW_API_URL"; cat "$RUNNER_TEMP/api.log"; exit 1
      - name: Chromium for Playwright
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium
      - name: The playground smoke, the lesson player and parent login
        working-directory: apps/web
        run: bunx playwright test
      - name: The api's log
        if: failure()
        run: cat "$RUNNER_TEMP/api.log"

  ci-ok:
    needs: [changes, lint, typecheck, unit, integration, supabase, contracts, docs, docs-site, fence-checks, gitleaks, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')"
          if [ -n "$bad" ]; then echo "::error::Not green: $bad"; exit 1; fi
