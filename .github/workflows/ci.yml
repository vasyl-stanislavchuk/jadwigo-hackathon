# CI for jadwigo (dl-5ssh.34.3). Every PR push and every push to main. No paths: filter: the
# changes job decides what runs, and turbo --affected decides which packages. ci-ok gathers every
# job and is CI's one required check, so a skipped job never leaves the PR pending. The other
# required check, review-ok, is a commit status that md's merge steward posts.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        name: Is anything outside docs changed?
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then base="$PR_BASE"; head="$PR_HEAD"; else base="$BEFORE"; head="$GITHUB_SHA"; fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "no usable base, so everything runs"; echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          code=false
          while IFS= read -r f; do
            case "$f" in
              docs/*|*.md) ;;
              *) code=true; echo "code change: $f" ;;
            esac
          done < <(git diff --name-only "$base" "$head")
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Biome per package (affected)
        run: bunx turbo run lint --affected
      - name: Biome on the root, knip, dependency-cruiser, no-bank, worklog
        run: bun run lint:repo

  typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bunx turbo run typecheck --affected

  unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bunx turbo run test --affected

  integration:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://runner:runner@localhost:5432/jadwigo_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Start the runner's Postgres (no Docker)
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "create role runner superuser login password 'runner'"
          createdb -h localhost -U runner jadwigo_test
        env:
          PGPASSWORD: runner
      - run: bunx turbo run test:int

  contracts:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: JSON Schema snapshots (CI never writes them, so drift fails)
        run: bunx turbo run test --filter=@jadwigo/contracts

  docs:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: The guard's tests
        run: bun test ./.claude/hooks/guard.test.ts
      - name: The worklog layout
        run: bun tools/src/check-worklog.ts

  fence-checks:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The PR title names an issue id
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'renovate[bot]'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$TITLE" =~ ^dl-[a-z0-9]+(\.[0-9]+)*:\  ]]; then
            echo "::error::The PR title must start with an issue id, as in 'dl-5ssh.34.3: CI with the ci-ok gate'. Got: $TITLE"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          cache: true
      - name: No question bank in git
        run: bun tools/src/check-no-bank.ts
      - name: The PR body has the /dev-pr shape
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'renovate[bot]'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          bun tools/src/check-pr-body.ts || {
            echo "::error::Fix the body (gh pr edit --body-file), then rerun this job: gh run rerun ${{ github.run_id }} --failed"
            exit 1
          }

  gitleaks:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks comes from mise.toml, the pin pre-commit uses, so Renovate moves one version.
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: gitleaks
          cache: true
      - name: No secrets in the commits this run brings
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then base="$PR_BASE"; head="$PR_HEAD"; else base="$BEFORE"; head="$GITHUB_SHA"; fi
          if [ -n "$base" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            set -- "--log-opts=${base}..${head}"
          else
            echo "no usable base, so the whole history is scanned"; set --
          fi
          gitleaks git --redact --no-banner --config .gitleaks.toml "$@"

  # OPEN: a browser job (a Playwright smoke that plays one sample lesson) joins ci-ok when apps/web
  # serves, with the playground port (dl-5ssh.34.6). Component tests already run in the unit job
  # (Vitest's dom project, happy-dom).

  ci-ok:
    needs: [changes, lint, typecheck, unit, integration, contracts, docs, fence-checks, gitleaks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')"
          if [ -n "$bad" ]; then echo "::error::Not green: $bad"; exit 1; fi
