<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 368" role="img" aria-labelledby="bank-pipeline-dark-title bank-pipeline-dark-desc">
<title id="bank-pipeline-dark-title">How the question bank grows</title>
<desc id="bank-pipeline-dark-desc">Build: Khan Academy exercises and Alfik contest tasks become set pages, AI enriches each page and code checks every quote, and the pages go into a search index. Evaluate: needs from the curriculum become test questions labelled by hand, and a gate holds every new search to the baseline before lessons draw from it.</desc>
