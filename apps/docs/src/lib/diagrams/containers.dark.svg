<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="containers-dark-title containers-dark-desc">
<title id="containers-dark-title">The containers</title>
<desc id="containers-dark-desc">Jadwigo's parts: the web app, the API, the database and the question bank, and who calls whom.</desc>
