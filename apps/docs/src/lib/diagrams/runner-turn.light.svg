<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="runner-turn-light-title runner-turn-light-desc">
<title id="runner-turn-light-title">One chat turn through the runner</title>
<desc id="runner-turn-light-desc">The API writes the message, the run and the queued step in 1 transaction, answers the web app, and pokes the runner. The runner reads the step, makes 1 Muse call, writes the run events fenced on its attempt and archives the step. The web app reads the events back.</desc>
