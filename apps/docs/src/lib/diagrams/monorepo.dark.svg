<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 376" role="img" aria-labelledby="monorepo-dark-title monorepo-dark-desc">
<title id="monorepo-dark-title">Three layers, imports point down</title>
<desc id="monorepo-dark-desc">Apps import domain packages and contracts. Domain packages import each other and contracts. Contracts import nothing of ours. Nothing imports an app.</desc>
<defs><marker id="monorepo-dark-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#a8b6cc"/></marker><marker id="monorepo-dark-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#6a7cff"/></marker><marker id="monorepo-dark-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#3db8b8"/></marker><marker id="monorepo-dark-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#a8b6cc" stroke-width="1.2"/></marker></defs>
<path d="M432,104 L432,152" fill="none" stroke="#a8b6cc" stroke-width="1.2" marker-end="url(#monorepo-dark-default)"/>
<path d="M432,232 L432,280" fill="none" stroke="#a8b6cc" stroke-width="1.2" marker-end="url(#monorepo-dark-default)"/>
<path d="M832,64 L872,64 Q880,64 880,72 L880,308 Q880,316 872,316 L832,316" fill="none" stroke="#a8b6cc" stroke-width="1.2" marker-end="url(#monorepo-dark-default)"/>
<rect x="32" y="24" width="800" height="80" rx="6" fill="#24262c" stroke="#7f8fa8" stroke-width="1"/>
<text x="432" y="61" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="7.5" font-weight="500" letter-spacing="0.18em" fill="#7f8fa8">APPS, NOTHING IMPORTS THEM</text>
<text x="432" y="75" text-anchor="middle" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">api, web, runner, converter, print, site, docs</text>
<rect x="32" y="152" width="800" height="80" rx="6" fill="#24262c" stroke="#a8b6cc" stroke-width="1"/>
<text x="432" y="182.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="7.5" font-weight="500" letter-spacing="0.18em" fill="#7f8fa8">DOMAIN PACKAGES</text>
<text x="432" y="196.5" text-anchor="middle" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">jadwigo-ai, lesson-import, lesson-kit, store, core, bank</text>
<text x="432" y="209.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#a8b6cc">api-client, analytics, ui, copy, config</text>
<rect x="32" y="280" width="800" height="72" rx="6" fill="rgba(106,124,255,0.14)" stroke="#6a7cff" stroke-width="1.5"/>
<text x="432" y="306.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="7.5" font-weight="500" letter-spacing="0.18em" fill="#6a7cff">THE BOTTOM</text>
<text x="432" y="320.5" text-anchor="middle" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">contracts</text>
<text x="432" y="333.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#a8b6cc">Zod schemas, imports nothing of ours</text>
