<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 184" role="img" aria-labelledby="pr-loop-dark-title pr-loop-dark-desc">
<title id="pr-loop-dark-title">How one change lands</title>
<desc id="pr-loop-dark-desc">An issue is a brief. An agent builds it in its own worktree and opens a draft pull request. Once it is ready, CI runs, then the merge steward's fresh reviewers. When both are green, GitHub squash-merges it. A red review goes back to the author.</desc>
<defs><marker id="pr-loop-dark-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#a8b6cc"/></marker><marker id="pr-loop-dark-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#6a7cff"/></marker><marker id="pr-loop-dark-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#3db8b8"/></marker><marker id="pr-loop-dark-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#a8b6cc" stroke-width="1.2"/></marker></defs>
<path d="M148,64 L172,64" fill="none" stroke="#a8b6cc" stroke-width="1.2" marker-end="url(#pr-loop-dark-default)"/>
<path d="M308,64 L332,64" fill="none" stroke="#a8b6cc" stroke-width="1.2" marker-end="url(#pr-loop-dark-default)"/>
<path d="M468,64 L492,64" fill="none" stroke="#a8b6cc" stroke-width="1.2" marker-end="url(#pr-loop-dark-default)"/>
<path d="M628,64 L652,64" fill="none" stroke="#a8b6cc" stroke-width="1.2" marker-end="url(#pr-loop-dark-default)"/>
<path d="M788,64 L812,64" fill="none" stroke="#6a7cff" stroke-width="1.5" marker-end="url(#pr-loop-dark-accent)"/>
<path d="M720,96 L720,128 Q720,136 712,136 L408,136 Q400,136 400,128 L400,96" fill="none" stroke="#a8b6cc" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#pr-loop-dark-default)"/>
<rect x="12" y="32" width="136" height="64" rx="6" fill="#24262c" stroke="#a8b6cc" stroke-width="1"/>
<text x="80" y="61.5" text-anchor="middle" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Issue</text>
<text x="80" y="74.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#a8b6cc">a brief on the board</text>
<rect x="172" y="32" width="136" height="64" rx="6" fill="#24262c" stroke="#a8b6cc" stroke-width="1"/>
<text x="240" y="61.5" text-anchor="middle" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Worktree</text>
<text x="240" y="74.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#a8b6cc">1 per agent, own branch</text>
<rect x="332" y="32" width="136" height="64" rx="6" fill="#24262c" stroke="#a8b6cc" stroke-width="1"/>
<text x="400" y="61.5" text-anchor="middle" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Draft PR</text>
<text x="400" y="74.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#a8b6cc">pushed often</text>
<rect x="492" y="32" width="136" height="64" rx="6" fill="#24262c" stroke="#a8b6cc" stroke-width="1"/>
<text x="560" y="61.5" text-anchor="middle" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">CI</text>
<text x="560" y="74.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#a8b6cc">lint, types, tests</text>
<rect x="652" y="32" width="136" height="64" rx="6" fill="rgba(106,124,255,0.14)" stroke="#6a7cff" stroke-width="1.5"/>
<text x="720" y="61.5" text-anchor="middle" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Reviewers</text>
<text x="720" y="74.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#a8b6cc">fresh agents</text>
<rect x="812" y="32" width="136" height="64" rx="6" fill="#24262c" stroke="#7f8fa8" stroke-width="1"/>
<text x="880" y="61.5" text-anchor="middle" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Auto-merge</text>
<text x="880" y="74.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#a8b6cc">squash into main</text>
<rect x="495.28" y="143" width="129.44" height="12" fill="#1d1e22"/>
<text x="560" y="152" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="#a8b6cc">red: back to the author</text>
<text x="560" y="24" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing="0.18em" fill="#7f8fa8">CI-OK</text>
<text x="720" y="24" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing="0.18em" fill="#7f8fa8">REVIEW-OK</text>
</svg>
