<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 624" role="img" aria-labelledby="connect-your-ai-light-title connect-your-ai-light-desc">
<title id="connect-your-ai-light-title">Connect your AI: OAuth 2.1, then the remote MCP</title>
<desc id="connect-your-ai-light-desc">How a parent&#x27;s AI app signs in by OAuth 2.1 and then calls Jadwigo&#x27;s remote MCP tools.</desc>
<defs><marker id="a-m-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#50535c"/></marker><marker id="a-a-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5fa8"/></marker><marker id="a-l-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f63b8"/></marker></defs>
<rect x="0" y="0" width="690" height="624" fill="#ffffff"/>

<rect x="20" y="24" width="140" height="44" rx="6" fill="#ffffff" stroke="#22252d" stroke-width="1"/>
<text x="90.0" y="50.0" text-anchor="middle" font-family="'Andika', system-ui, sans-serif" font-size="12" font-weight="700" fill="#22252d">Parent&#x27;s AI app</text>
