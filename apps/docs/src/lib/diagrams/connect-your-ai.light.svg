<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 504" role="img" aria-labelledby="connect-your-ai-light-title connect-your-ai-light-desc">
<title id="connect-your-ai-light-title">Connecting a parent's own AI app</title>
<desc id="connect-your-ai-light-desc">The AI app calls /api/mcp, gets a 401 that names where to sign in, and asks Supabase Auth. The parent signs in and says yes. The app gets a token for at most 1 hour and calls the tools with it, and the API answers with this family's data only.</desc>
