<rect x="114.8" y="138" width="120" height="16" fill="#ffffff"/>
<text x="175" y="149" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" letter-spacing="0.5" fill="#726f68">401, METADATA NAMED</text>
