<rect x="420.56" y="339" width="118.88000000000001" height="12" fill="#ffffff"/>
<text x="480" y="348" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="#5a6b85">token, 1 hour at most</text>
<rect x="656.48" y="375" width="103.04" height="12" fill="#ffffff"/>
