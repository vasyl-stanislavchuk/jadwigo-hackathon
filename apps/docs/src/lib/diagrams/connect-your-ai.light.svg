<text x="311.0" y="513" font-family="ui-monospace, monospace" font-size="8" letter-spacing="0.5" fill="#726f68">AUTHORIZE MEMBER, 1 UNIT</text>
<polyline points="260,550 90,550" fill="none" stroke="#50535c" stroke-width="1.2" marker-end="url(#a-m-light)"/>
<rect x="109.2" y="534" width="132" height="16" fill="#ffffff"/>
<text x="175" y="545" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" letter-spacing="0.5" fill="#726f68">RESULT, ONLY THIS POD</text>
