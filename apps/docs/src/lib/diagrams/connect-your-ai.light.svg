<rect x="360" y="24" width="140" height="44" rx="6" fill="#ffffff" stroke="#22252d" stroke-width="1"/>
<text x="430.0" y="42.0" text-anchor="middle" font-family="'Andika', system-ui, sans-serif" font-size="12" font-weight="700" fill="#22252d">Supabase Auth</text>
<text x="430.0" y="56.0" text-anchor="middle" font-family="'Andika', system-ui, sans-serif" font-size="12" font-weight="700" fill="#22252d">OAuth 2.1</text>
