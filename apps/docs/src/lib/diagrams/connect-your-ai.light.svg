<polyline points="90,110 260,110" fill="none" stroke="#2f63b8" stroke-width="1.2" marker-end="url(#a-l-light)"/>
<rect x="103.6" y="94" width="143" height="16" fill="#ffffff"/>
<text x="175" y="105" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" letter-spacing="0.5" fill="#726f68">POST /API/MCP, NO TOKEN</text>
