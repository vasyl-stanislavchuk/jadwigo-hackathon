<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 176" role="img" aria-labelledby="story-timeline-dark-title story-timeline-dark-desc">
<title id="story-timeline-dark-title">Jadwigo in 10 days</title>
<desc id="story-timeline-dark-desc">From the first commit on 26 October to demo day on 4 November: the board, the first lesson from the bank, the dream, English lessons, the chat-first parent app, the demo cut, and demo day, when the whole class practises for tomorrow's test.</desc>
