<title id="next-lesson-dark-title">From a brief to the next lesson</title>
<desc id="next-lesson-dark-desc">The brief becomes one need per entry. The draw picks unseen or due questions with spacing, and returns the questions it drew and the ones it left out, each with its reason.</desc>
