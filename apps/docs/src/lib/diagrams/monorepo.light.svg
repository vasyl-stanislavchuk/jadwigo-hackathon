<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 376" role="img" aria-labelledby="monorepo-light-title monorepo-light-desc">
<title id="monorepo-light-title">Three layers, imports point down</title>
<desc id="monorepo-light-desc">Apps import domain packages and contracts. Domain packages import each other and contracts. Contracts import nothing of ours. Nothing imports an app.</desc>
<defs><marker id="monorepo-light-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#5a6b85"/></marker><marker id="monorepo-light-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#2941f3"/></marker><marker id="monorepo-light-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#0f7f76"/></marker><marker id="monorepo-light-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#5a6b85" stroke-width="1.2"/></marker></defs>
<path d="M432,104 L432,152" fill="none" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#monorepo-light-default)"/>
<path d="M432,232 L432,280" fill="none" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#monorepo-light-default)"/>
<path d="M832,64 L872,64 Q880,64 880,72 L880,308 Q880,316 872,316 L832,316" fill="none" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#monorepo-light-default)"/>
<rect x="32" y="24" width="800" height="80" rx="6" fill="#ffffff" stroke="#7888a0" stroke-width="1"/>
<text x="432" y="61" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="7.5" font-weight="500" letter-spacing="0.18em" fill="#7888a0">APPS, NOTHING IMPORTS THEM</text>
<text x="432" y="75" text-anchor="middle" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="12" font-weight="600" fill="#040810">api, web, runner, converter, print, site, docs</text>
<rect x="32" y="152" width="800" height="80" rx="6" fill="#ffffff" stroke="#5a6b85" stroke-width="1"/>
<text x="432" y="182.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="7.5" font-weight="500" letter-spacing="0.18em" fill="#7888a0">DOMAIN PACKAGES</text>
<text x="432" y="196.5" text-anchor="middle" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="12" font-weight="600" fill="#040810">jadwigo-ai, lesson-import, lesson-kit, store, core, bank</text>
<text x="432" y="209.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#5a6b85">api-client, analytics, ui, copy, config</text>
<rect x="32" y="280" width="800" height="72" rx="6" fill="rgba(41,65,243,0.10)" stroke="#2941f3" stroke-width="1.5"/>
<text x="432" y="306.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="7.5" font-weight="500" letter-spacing="0.18em" fill="#2941f3">THE BOTTOM</text>
<text x="432" y="320.5" text-anchor="middle" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="12" font-weight="600" fill="#040810">contracts</text>
<text x="432" y="333.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#5a6b85">Zod schemas, imports nothing of ours</text>
<rect x="436" y="123" width="39.68" height="12" fill="#ffffff"/>
<text x="440" y="132" text-anchor="start" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="#5a6b85">import</text>
<rect x="436" y="251" width="39.68" height="12" fill="#ffffff"/>
<text x="440" y="260" text-anchor="start" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="#5a6b85">import</text>
<rect x="884" y="183" width="39.68" height="12" fill="#ffffff"/>
<text x="888" y="192" text-anchor="start" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="#5a6b85">import</text>
</svg>
