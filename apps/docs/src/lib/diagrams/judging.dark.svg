<path d="M592,100 L592,132 Q592,140 584,140 L360,140 Q352,140 352,148 L352,184" fill="none" stroke="#a8b6cc" stroke-width="1.2" marker-end="url(#judging-dark-default)"/>
<path d="M448,214 L496,214" fill="none" stroke="#a8b6cc" stroke-width="1.2" marker-end="url(#judging-dark-default)"/>
<path d="M688,214 L736,214" fill="none" stroke="#6a7cff" stroke-width="1.5" marker-end="url(#judging-dark-accent)"/>
<rect x="16" y="40" width="192" height="60" rx="6" fill="#24262c" stroke="#7f8fa8" stroke-width="1"/>
<text x="112" y="67.5" text-anchor="middle" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Criteria first</text>
<text x="112" y="80.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#a8b6cc">before the child answers</text>
<rect x="256" y="40" width="192" height="60" rx="6" fill="#24262c" stroke="#7f8fa8" stroke-width="1"/>
<text x="352" y="67.5" text-anchor="middle" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">The child's answer</text>
<text x="352" y="80.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#a8b6cc">in their own words</text>
<rect x="496" y="40" width="192" height="60" rx="6" fill="#24262c" stroke="#a8b6cc" stroke-width="1"/>
<text x="592" y="67.5" text-anchor="middle" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Code check</text>
<text x="592" y="80.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#a8b6cc">empty or too short?</text>
<rect x="736" y="40" width="192" height="60" rx="6" fill="rgba(255,255,255,0.02)" stroke="#7f8fa8" stroke-width="1" stroke-dasharray="2,3"/>
<text x="832" y="67.5" text-anchor="middle" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Ask for a little more</text>
<text x="832" y="80.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#a8b6cc">no verdict yet</text>
<rect x="256" y="184" width="192" height="60" rx="6" fill="rgba(168,182,204,0.12)" stroke="#93a1b8" stroke-width="1"/>
<text x="352" y="211.5" text-anchor="middle" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Kept for the tutor</text>
<text x="352" y="224.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#a8b6cc">not judged by code</text>
<rect x="496" y="184" width="192" height="60" rx="6" fill="rgba(106,124,255,0.14)" stroke="#6a7cff" stroke-width="1.5"/>
<text x="592" y="211.5" text-anchor="middle" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">AI judge</text>
<text x="592" y="224.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#a8b6cc">1 verdict a criterion</text>
<rect x="736" y="184" width="192" height="60" rx="6" fill="#24262c" stroke="#a8b6cc" stroke-width="1"/>
<text x="832" y="211.5" text-anchor="middle" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Feedback</text>
<text x="832" y="224.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#a8b6cc">short, kind, 1 next step</text>
<rect x="700.08" y="53" width="23.84" height="12" fill="#1d1e22"/>
<text x="712" y="62" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="#a8b6cc">yes</text>
<rect x="537.84" y="5" width="108.32000000000001" height="12" fill="#1d1e22"/>
<text x="592" y="14" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="#a8b6cc">the child adds more</text>
<rect x="596" y="115" width="18.560000000000002" height="12" fill="#1d1e22"/>
<text x="600" y="124" text-anchor="start" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="#a8b6cc">no</text>
</svg>
