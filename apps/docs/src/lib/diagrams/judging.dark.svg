<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 264" role="img" aria-labelledby="judging-dark-title judging-dark-desc">
<title id="judging-dark-title">Judging a written answer</title>
<desc id="judging-dark-desc">The criteria are written before the child answers. Code only checks that the answer is empty or too short, and asks for a little more. Any other answer is kept for the tutor: an AI judge gives one verdict per criterion with a reason, and the child reads short, kind feedback with one next step.</desc>
<defs><marker id="judging-dark-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#a8b6cc"/></marker><marker id="judging-dark-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#6a7cff"/></marker><marker id="judging-dark-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#3db8b8"/></marker><marker id="judging-dark-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#a8b6cc" stroke-width="1.2"/></marker></defs>
<path d="M208,70 L256,70" fill="none" stroke="#a8b6cc" stroke-width="1.2" marker-end="url(#judging-dark-default)"/>
<path d="M448,70 L496,70" fill="none" stroke="#a8b6cc" stroke-width="1.2" marker-end="url(#judging-dark-default)"/>
