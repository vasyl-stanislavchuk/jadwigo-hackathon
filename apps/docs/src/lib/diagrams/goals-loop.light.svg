<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 184" role="img" aria-labelledby="goals-loop-light-title goals-loop-light-desc">
<title id="goals-loop-light-title">The goals loop</title>
<desc id="goals-loop-light-desc">A parent's goal draws lessons, playing makes evidence, the report shows what changed, and the parent sets the next goal, which draws the next lessons.</desc>
<defs><marker id="goals-loop-light-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#5a6b85"/></marker><marker id="goals-loop-light-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#2941f3"/></marker><marker id="goals-loop-light-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#0f7f76"/></marker><marker id="goals-loop-light-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#5a6b85" stroke-width="1.2"/></marker></defs>
<path d="M176,64 L208,64" fill="none" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#goals-loop-light-default)"/>
<path d="M368,64 L400,64" fill="none" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#goals-loop-light-default)"/>
<path d="M560,64 L592,64" fill="none" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#goals-loop-light-default)"/>
<path d="M752,64 L784,64" fill="none" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#goals-loop-light-default)"/>
<path d="M864,96 L864,128 Q864,136 856,136 L296,136 Q288,136 288,128 L288,96" fill="none" stroke="#5a6b85" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#goals-loop-light-default)"/>
<rect x="16" y="32" width="160" height="64" rx="6" fill="#ffffff" stroke="#7888a0" stroke-width="1"/>
<text x="96" y="61.5" text-anchor="middle" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="12" font-weight="600" fill="#040810">A parent's goal</text>
<text x="96" y="74.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#5a6b85">in their own words</text>
<rect x="208" y="32" width="160" height="64" rx="6" fill="#ffffff" stroke="#5a6b85" stroke-width="1"/>
<text x="288" y="61.5" text-anchor="middle" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="12" font-weight="600" fill="#040810">Lessons</text>
<text x="288" y="74.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#5a6b85">drawn for the goal</text>
<rect x="400" y="32" width="160" height="64" rx="6" fill="rgba(41,65,243,0.10)" stroke="#2941f3" stroke-width="1.5"/>
<text x="480" y="61.5" text-anchor="middle" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="12" font-weight="600" fill="#040810">Evidence</text>
<text x="480" y="74.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#5a6b85">from playing</text>
<rect x="592" y="32" width="160" height="64" rx="6" fill="#ffffff" stroke="#5a6b85" stroke-width="1"/>
<text x="672" y="61.5" text-anchor="middle" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="12" font-weight="600" fill="#040810">The report</text>
<text x="672" y="74.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#5a6b85">what changed</text>
<rect x="784" y="32" width="160" height="64" rx="6" fill="#ffffff" stroke="#5a6b85" stroke-width="1"/>
<text x="864" y="61.5" text-anchor="middle" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="12" font-weight="600" fill="#040810">The next goal</text>
<text x="864" y="74.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#5a6b85">the parent decides</text>
<rect x="535.04" y="147" width="81.92" height="12" fill="#ffffff"/>
<text x="576" y="156" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="#5a6b85">the next round</text>
</svg>
