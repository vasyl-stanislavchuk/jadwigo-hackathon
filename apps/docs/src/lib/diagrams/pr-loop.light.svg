<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 184" role="img" aria-labelledby="pr-loop-light-title pr-loop-light-desc">
<title id="pr-loop-light-title">How one change lands</title>
<desc id="pr-loop-light-desc">An issue is a brief. An agent builds it in its own worktree and opens a draft pull request. Once it is ready, CI runs, then the merge steward's fresh reviewers. When both are green, GitHub squash-merges it. A red review goes back to the author.</desc>
<defs><marker id="pr-loop-light-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#5a6b85"/></marker><marker id="pr-loop-light-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#2941f3"/></marker><marker id="pr-loop-light-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#0f7f76"/></marker><marker id="pr-loop-light-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#5a6b85" stroke-width="1.2"/></marker></defs>
<path d="M148,64 L172,64" fill="none" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#pr-loop-light-default)"/>
<path d="M308,64 L332,64" fill="none" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#pr-loop-light-default)"/>
<path d="M468,64 L492,64" fill="none" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#pr-loop-light-default)"/>
<path d="M628,64 L652,64" fill="none" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#pr-loop-light-default)"/>
<path d="M788,64 L812,64" fill="none" stroke="#2941f3" stroke-width="1.5" marker-end="url(#pr-loop-light-accent)"/>
<path d="M720,96 L720,128 Q720,136 712,136 L408,136 Q400,136 400,128 L400,96" fill="none" stroke="#5a6b85" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#pr-loop-light-default)"/>
<rect x="12" y="32" width="136" height="64" rx="6" fill="#ffffff" stroke="#5a6b85" stroke-width="1"/>
<text x="80" y="61.5" text-anchor="middle" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="12" font-weight="600" fill="#040810">Issue</text>
<text x="80" y="74.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#5a6b85">a brief on the board</text>
<rect x="172" y="32" width="136" height="64" rx="6" fill="#ffffff" stroke="#5a6b85" stroke-width="1"/>
<text x="240" y="61.5" text-anchor="middle" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="12" font-weight="600" fill="#040810">Worktree</text>
<text x="240" y="74.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#5a6b85">1 per agent, own branch</text>
<rect x="332" y="32" width="136" height="64" rx="6" fill="#ffffff" stroke="#5a6b85" stroke-width="1"/>
<text x="400" y="61.5" text-anchor="middle" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="12" font-weight="600" fill="#040810">Draft PR</text>
<text x="400" y="74.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#5a6b85">pushed often</text>
<rect x="492" y="32" width="136" height="64" rx="6" fill="#ffffff" stroke="#5a6b85" stroke-width="1"/>
<text x="560" y="61.5" text-anchor="middle" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="12" font-weight="600" fill="#040810">CI</text>
<text x="560" y="74.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#5a6b85">lint, types, tests</text>
<rect x="652" y="32" width="136" height="64" rx="6" fill="rgba(41,65,243,0.10)" stroke="#2941f3" stroke-width="1.5"/>
<text x="720" y="61.5" text-anchor="middle" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="12" font-weight="600" fill="#040810">Reviewers</text>
<text x="720" y="74.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#5a6b85">fresh agents</text>
<rect x="812" y="32" width="136" height="64" rx="6" fill="#ffffff" stroke="#7888a0" stroke-width="1"/>
<text x="880" y="61.5" text-anchor="middle" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="12" font-weight="600" fill="#040810">Auto-merge</text>
<text x="880" y="74.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#5a6b85">squash into main</text>
<rect x="495.28" y="143" width="129.44" height="12" fill="#ffffff"/>
<text x="560" y="152" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="#5a6b85">red: back to the author</text>
<text x="560" y="24" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing="0.18em" fill="#7888a0">CI-OK</text>
<text x="720" y="24" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing="0.18em" fill="#7888a0">REVIEW-OK</text>
</svg>
