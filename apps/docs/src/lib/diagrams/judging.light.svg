<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 264" role="img" aria-labelledby="judging-light-title judging-light-desc">
<title id="judging-light-title">Judging a written answer</title>
<desc id="judging-light-desc">The criteria are written before the child answers. Code only checks that the answer is empty or too short, and asks for a little more. Any other answer is kept for the tutor: an AI judge gives one verdict per criterion with a reason, and the child reads short, kind feedback with one next step.</desc>
<defs><marker id="judging-light-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#5a6b85"/></marker><marker id="judging-light-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#2941f3"/></marker><marker id="judging-light-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#0f7f76"/></marker><marker id="judging-light-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#5a6b85" stroke-width="1.2"/></marker></defs>
<path d="M208,70 L256,70" fill="none" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#judging-light-default)"/>
<path d="M448,70 L496,70" fill="none" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#judging-light-default)"/>
