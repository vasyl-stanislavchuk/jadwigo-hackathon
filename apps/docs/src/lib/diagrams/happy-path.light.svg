<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 544" role="img" aria-labelledby="happy-path-light-title happy-path-light-desc">
<title id="happy-path-light-title">From a photo to a child playing</title>
<desc id="happy-path-light-desc">A parent sends a photo with a message. The API pokes the runner, which asks Meta Muse for a step. The model drafts a lesson from the bank and the check passes in code. The parent gives the lesson and shares its play link, and the child plays it with no login.</desc>
