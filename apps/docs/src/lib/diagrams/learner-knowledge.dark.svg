<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 232" role="img" aria-labelledby="learner-knowledge-dark-title learner-knowledge-dark-desc">
<title id="learner-knowledge-dark-title">What Jadwigo knows about a learner</title>
<desc id="learner-knowledge-dark-desc">Every first try, help and skip is evidence. It folds to one happening per question, which moves a mastery level and a memory card's next due date. Both feed a brief, and the brief shapes the next lesson and the parent's report.</desc>
