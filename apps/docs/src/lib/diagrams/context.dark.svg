<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 352" role="img" aria-labelledby="context-dark-title context-dark-desc">
<title id="context-dark-title">Jadwigo in its world</title>
<desc id="context-dark-desc">A child, a parent, the parent's own AI app and a lesson author use Jadwigo. Jadwigo keeps its records in Supabase, asks Meta Muse for each AI step, and composes lessons from its question bank.</desc>
