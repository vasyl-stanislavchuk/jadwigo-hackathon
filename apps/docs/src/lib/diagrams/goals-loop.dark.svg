<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 184" role="img" aria-labelledby="goals-loop-dark-title goals-loop-dark-desc">
<title id="goals-loop-dark-title">The goals loop</title>
<desc id="goals-loop-dark-desc">A parent's goal draws lessons, playing makes evidence, the report shows what changed, and the parent sets the next goal, which draws the next lessons.</desc>
<defs><marker id="goals-loop-dark-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#a8b6cc"/></marker><marker id="goals-loop-dark-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#6a7cff"/></marker><marker id="goals-loop-dark-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#3db8b8"/></marker><marker id="goals-loop-dark-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#a8b6cc" stroke-width="1.2"/></marker></defs>
<path d="M176,64 L208,64" fill="none" stroke="#a8b6cc" stroke-width="1.2" marker-end="url(#goals-loop-dark-default)"/>
<path d="M368,64 L400,64" fill="none" stroke="#a8b6cc" stroke-width="1.2" marker-end="url(#goals-loop-dark-default)"/>
<path d="M560,64 L592,64" fill="none" stroke="#a8b6cc" stroke-width="1.2" marker-end="url(#goals-loop-dark-default)"/>
<path d="M752,64 L784,64" fill="none" stroke="#a8b6cc" stroke-width="1.2" marker-end="url(#goals-loop-dark-default)"/>
<path d="M864,96 L864,128 Q864,136 856,136 L296,136 Q288,136 288,128 L288,96" fill="none" stroke="#a8b6cc" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#goals-loop-dark-default)"/>
<rect x="16" y="32" width="160" height="64" rx="6" fill="#24262c" stroke="#7f8fa8" stroke-width="1"/>
<text x="96" y="61.5" text-anchor="middle" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">A parent's goal</text>
<text x="96" y="74.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#a8b6cc">in their own words</text>
<rect x="208" y="32" width="160" height="64" rx="6" fill="#24262c" stroke="#a8b6cc" stroke-width="1"/>
<text x="288" y="61.5" text-anchor="middle" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Lessons</text>
<text x="288" y="74.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#a8b6cc">drawn for the goal</text>
<rect x="400" y="32" width="160" height="64" rx="6" fill="rgba(106,124,255,0.14)" stroke="#6a7cff" stroke-width="1.5"/>
<text x="480" y="61.5" text-anchor="middle" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Evidence</text>
<text x="480" y="74.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#a8b6cc">from playing</text>
<rect x="592" y="32" width="160" height="64" rx="6" fill="#24262c" stroke="#a8b6cc" stroke-width="1"/>
<text x="672" y="61.5" text-anchor="middle" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">The report</text>
<text x="672" y="74.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#a8b6cc">what changed</text>
<rect x="784" y="32" width="160" height="64" rx="6" fill="#24262c" stroke="#a8b6cc" stroke-width="1"/>
<text x="864" y="61.5" text-anchor="middle" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">The next goal</text>
<text x="864" y="74.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#a8b6cc">the parent decides</text>
<rect x="535.04" y="147" width="81.92" height="12" fill="#1d1e22"/>
<text x="576" y="156" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="#a8b6cc">the next round</text>
</svg>
