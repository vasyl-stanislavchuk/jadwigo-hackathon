<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="ai-engine-light-title ai-engine-light-desc">
<title id="ai-engine-light-title">The AI engine's parts</title>
<desc id="ai-engine-light-desc">The step queue hands the step loop 1 step. The loop asks GuardedMuse, which checks the spend cap and writes a ledger row, for 1 Meta Muse call. The loop runs the verbs the model asks for, and every effect becomes a run event that the page folds into the chat and the lesson.</desc>
