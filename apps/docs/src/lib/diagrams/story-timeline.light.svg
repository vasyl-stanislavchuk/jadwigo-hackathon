<title id="story-timeline-light-title">Jadwigo in 10 days</title>
<desc id="story-timeline-light-desc">From the first commit on 26 October to demo day on 4 November: the board, the first lesson from the bank, the dream, English lessons, the chat-first parent app, the demo cut and demo day.</desc>
