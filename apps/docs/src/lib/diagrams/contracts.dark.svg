<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 456" role="img" aria-labelledby="contracts-dark-title contracts-dark-desc">
<title id="contracts-dark-title">One route table, every reader</title>
<desc id="contracts-dark-desc">ROUTES in the contracts package feeds the API, the typed client, the Terraform route list and the OpenAPI snapshot. The docs build reads the snapshot and the other sources, check-dist reads the built site, and only then is docs.jadwigo.pl published.</desc>
