<text x="362.0" y="355.0" text-anchor="middle" font-family="'Andika', system-ui, sans-serif" font-size="12" font-weight="700" fill="#22252d">docs.jadwigo.pl</text>
<text x="362.0" y="369.0" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#726f68">these docs, static</text>
<rect x="700" y="110" width="236" height="210" rx="8" fill="none" stroke="#e8e2d5" stroke-width="1.5"/>
<text x="712" y="130" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1.5" fill="#726f68">SUPABASE, FRANKFURT</text>
<rect x="724" y="148" width="188" height="56" rx="6" fill="#f2eee6" stroke="#50535c" stroke-width="1"/>
