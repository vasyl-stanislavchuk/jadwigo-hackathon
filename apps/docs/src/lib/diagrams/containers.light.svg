<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="containers-light-title containers-light-desc">
<title id="containers-light-title">The containers</title>
<desc id="containers-light-desc">Jadwigo's parts: the web app, the API, the database and the question bank, and who calls whom.</desc>
<defs><marker id="a-m-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#50535c"/></marker><marker id="a-a-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5fa8"/></marker><marker id="a-l-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f63b8"/></marker></defs>
<rect x="0" y="0" width="960" height="440" fill="#ffffff"/>
<rect x="40" y="24" width="150" height="52" rx="16" fill="#ffffff" stroke="#50535c" stroke-width="1" stroke-dasharray="5,4"/>
<text x="115.0" y="47.0" text-anchor="middle" font-family="'Andika', system-ui, sans-serif" font-size="12" font-weight="700" fill="#22252d">Child</text>
<text x="115.0" y="61.0" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#726f68">plays, no login</text>
