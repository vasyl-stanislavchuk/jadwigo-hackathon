<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392" role="img" aria-labelledby="containers-light-title containers-light-desc">
<title id="containers-light-title">The containers on the runtime path</title>
<desc id="containers-light-desc">The web app calls the API through API Gateway. The API writes to Postgres, searches the question bank and pokes the runner. The runner drains its steps from Postgres, calls Meta Muse once per step, has the converter turn files into page images, and reads the photos the web app uploaded.</desc>
