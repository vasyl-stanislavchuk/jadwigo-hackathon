<text x="138.0" y="265.0" text-anchor="middle" font-family="'Andika', system-ui, sans-serif" font-size="12" font-weight="700" fill="#22252d">API</text>
<text x="138.0" y="279.0" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#726f68">one Lambda, every route</text>
