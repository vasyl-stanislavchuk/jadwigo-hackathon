<text x="818.0" y="279.0" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#726f68">6-digit email code</text>
<rect x="700" y="348" width="236" height="56" rx="6" fill="#ffffff" stroke="#22252d" stroke-width="1"/>
<text x="818.0" y="373.0" text-anchor="middle" font-family="'Andika', system-ui, sans-serif" font-size="12" font-weight="700" fill="#22252d">jw and its MCP server</text>
<text x="818.0" y="387.0" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#726f68">Python CLI, author's machine</text>
