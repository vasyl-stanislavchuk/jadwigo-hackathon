<text x="315.0" y="47.0" text-anchor="middle" font-family="'Andika', system-ui, sans-serif" font-size="12" font-weight="700" fill="#22252d">Parent</text>
<text x="315.0" y="61.0" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#726f68">signs in, reads results</text>
<rect x="700" y="24" width="220" height="52" rx="16" fill="#ffffff" stroke="#50535c" stroke-width="1" stroke-dasharray="5,4"/>
<text x="810.0" y="47.0" text-anchor="middle" font-family="'Andika', system-ui, sans-serif" font-size="12" font-weight="700" fill="#22252d">Lesson author or agent</text>
<text x="810.0" y="61.0" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#726f68">searches the bank</text>
<rect x="24" y="110" width="640" height="300" rx="8" fill="none" stroke="#e8e2d5" stroke-width="1.5"/>
<text x="36" y="130" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1.5" fill="#726f68">AWS, EU-CENTRAL-1</text>
