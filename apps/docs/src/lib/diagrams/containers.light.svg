<text x="138.0" y="187.0" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#726f68">React, static in S3</text>
<rect x="272" y="148" width="180" height="56" rx="6" fill="#ffffff" stroke="#22252d" stroke-width="1"/>
<text x="362.0" y="173.0" text-anchor="middle" font-family="'Andika', system-ui, sans-serif" font-size="12" font-weight="700" fill="#22252d">HTTP API</text>
