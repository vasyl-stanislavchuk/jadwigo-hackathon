<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 176" role="img" aria-labelledby="learner-knowledge-light-title learner-knowledge-light-desc">
<title id="learner-knowledge-light-title">Learner knowledge</title>
<desc id="learner-knowledge-light-desc">Every answer becomes evidence, folded into a mastery level and a review date, then a brief for the next lesson.</desc>
<defs><marker id="a-learner-knowledge-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#50535c"/></marker></defs>
<rect x="0" y="0" width="960" height="176" fill="#ffffff"/>
<line x1="186" y1="88" x2="216" y2="88" stroke="#50535c" stroke-width="1.5" marker-end="url(#a-learner-knowledge-light)"/>
<line x1="372" y1="88" x2="402" y2="88" stroke="#50535c" stroke-width="1.5" marker-end="url(#a-learner-knowledge-light)"/>
<line x1="558" y1="88" x2="588" y2="88" stroke="#50535c" stroke-width="1.5" marker-end="url(#a-learner-knowledge-light)"/>
<line x1="744" y1="88" x2="774" y2="88" stroke="#50535c" stroke-width="1.5" marker-end="url(#a-learner-knowledge-light)"/>
<rect x="30" y="56" width="156" height="64" rx="6" fill="#ffffff" stroke="#50535c" stroke-width="1.5"/>
<text x="108" y="84" text-anchor="middle" font-family="'Andika', system-ui, sans-serif" font-size="13" font-weight="700" fill="#22252d">Evidence</text>
<text x="108" y="102" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#726f68">every first try, help, skip</text>
<rect x="216" y="56" width="156" height="64" rx="6" fill="#ffffff" stroke="#50535c" stroke-width="1.5"/>
<text x="294" y="84" text-anchor="middle" font-family="'Andika', system-ui, sans-serif" font-size="13" font-weight="700" fill="#22252d">Fold</text>
<text x="294" y="102" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#726f68">one result per question</text>
<rect x="402" y="56" width="156" height="64" rx="6" fill="#dce8fb" stroke="#3a5fa8" stroke-width="1.5"/>
<text x="480" y="84" text-anchor="middle" font-family="'Andika', system-ui, sans-serif" font-size="13" font-weight="700" fill="#22252d">Mastery + FSRS</text>
<text x="480" y="102" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#726f68">a level and a due date</text>
<rect x="588" y="56" width="156" height="64" rx="6" fill="#ffffff" stroke="#50535c" stroke-width="1.5"/>
<text x="666" y="84" text-anchor="middle" font-family="'Andika', system-ui, sans-serif" font-size="13" font-weight="700" fill="#22252d">Brief</text>
<text x="666" y="102" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#726f68">reteach, review, new, recheck</text>
<rect x="774" y="56" width="156" height="64" rx="6" fill="#ffffff" stroke="#50535c" stroke-width="1.5"/>
<text x="852" y="84" text-anchor="middle" font-family="'Andika', system-ui, sans-serif" font-size="13" font-weight="700" fill="#22252d">Next lesson + report</text>
<text x="852" y="102" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#726f68">what the parent sees</text>
</svg>
