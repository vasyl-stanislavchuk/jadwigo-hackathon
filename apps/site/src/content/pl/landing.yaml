  text: Dziecko ćwiczy w swoim tempie, a Ty widzisz, jak rośnie.
  pic: Rodzic i dziecko nad zeszytem z pracą domową, obok mała Jadwiga i jej dwór z piórnika.
  child: { initial: Z, name: Zosia, sub: klasa 3 · z Jadwigo od września }
  practising: "Ćwiczy:"
  allDone: Umie wszystko.
  nextUp: "Dalej:"
  states: { done: umie, now: ćwiczy teraz, next: następne }
  goals:
    - name: Pieniądze i zakupy
