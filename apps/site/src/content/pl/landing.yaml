# The site's words beyond each page's frontmatter (src/lib/landing.ts). Copy says what Jadwigo does,
# never a slogan; numbers are digits; the child is "ty", the parent "Ty" (decisions of 2026-10-27).
# The hero is the h1 and one question to answer: no lead line, no buttons (owner, 2026-10-31, dl-5ssh.4.9).
# Lines below marked "draft" are the design handoff "landing 3" drafts (2026-11-01), for the native review.
hero:
  # Beside the h1 (owner, 2026-11-02: less text on top; dl-5ssh.4.46): the alt text of the table picture (dl-5ssh.4.48).
  pic: Rodzic i dziecko nad zeszytem z pracą domową, obok mała Jadwiga i jej dwór z piórnika.
  # A grade 3 two-step word problem: the owner found "2 razy 7" too simple for a 9-10-year-old (draft).
  # 36 is "forgot to take away", 45 is "added instead". The source is not confirmed yet.
  question:
    label: Dwa działania · klasa 3 · pytanie 1
    say: Zoja ma 3 paczki kredek, po 12 w każdej. Koleżankom dała 9 kredek. Ile kredek jej zostało?
    # Each `pic` is its picture's alt text (dl-5ssh.4.24); the pictures are in src/lib/illustrations.ts.
    pic: Mała królowa Jadwiga niesie na ramieniu kredkę większą od siebie, korona zsunęła się jej na oko.
    source: "Źródło: Alfik Matematyczny"
    choices: ["27", "36", "45"]
    answer: "27"
    right: Brawo! 3 razy 12 to 36, a 36 − 9 = 27.
    hint: Prawie. Najpierw policz wszystkie kredki, 3 razy 12. Potem odejmij te 9, które dała. Spróbuj jeszcze raz.
    signUp:
      text: Tak wygląda każda lekcja. Załóż konto rodzica, a Jadwigo z każdej lekcji ułoży następną.
      button: Załóż konto
      again: Spróbuj tego pytania jeszcze raz
# Under the lessons, one line for the parent.
after:
  text: Z czym dziecko miało kłopot i czemu poświęcić więcej uwagi.
# Every page in the header, in order (owner, 2026-10-31: each link its own page).
links:
  - { href: /lekcje, label: Lekcje }
  - { href: /jak-to-dziala, label: Jak to działa }
  - { href: /porownanie, label: Porównanie }
  - { href: /jadwigo-ai, label: Jadwigo AI }
  - { href: /o-nas, label: O nas }
# /jak-to-dziala in direction 1a (design handoff "landing 3", 2026-11-01; draft). The owner's principle:
# the parent is aware and close in a few minutes, never required to sit through a lesson together.
steps:
  title: Jak działa Jadwigo
  description: Pokaż Jadwigo pracę domową albo napisz, czego uczy się dziecko. Dziecko przerabia krótką lekcję, a Ty wiesz, gdzie pomóc.
  heading: Jak to działa
  intro: Nie musisz siedzieć obok przez całą lekcję. Wystarczy kilka minut, żeby wiedzieć, co dziecko umie i z czym ma trudność.
  pic: Jadwiga otwiera wielki zeszyt, a Gumka, Ołówek i Linijka szykują stół.
  items:
    - who: Ty
      title: Pokaż, czego uczy się dziecko
      text: Wyślij zdjęcie pracy domowej albo napisz, z czym dziecko ma kłopot. Jadwigo ułoży z tego krótką lekcję.
    - who: Dziecko
      title: Dziecko przerabia lekcję
      text: Na tablecie, na komputerze albo wydrukowaną na kartce. Podpowiedź jest pod ręką, a skończyć można w każdej chwili.
    - who: Ty
      title: Wiesz, gdzie pomóc
      text: "Na stronie dziecka widzisz, co już umie, nad czym pracuje i co dalej, a przy tym każde pytanie i każdą próbę, opisane zwykłymi słowami. Następną lekcję Jadwigo zaczyna od tego, co było trudne."
  request:
    ask: Praca domowa z mnożenia. Myli 7 × 8 z 6 × 9.
    lines: [Czytanie pracy domowej…, Szukanie pytań o 7 × 8 i 6 × 9…, Sprawdzanie lekcji…, Gotowe]
    screencast: "Nagranie ekranu: rodzic dodaje zdjęcie pracy domowej i prosi o lekcję. Lekcja pojawia się w rozmowie, gotowa do dania dziecku."
  card:
    say: W pudełku jest 7 rzędów po 8 ołówków. Ile ołówków jest w pudełku?
    choices: ["54", "56", "64"]
    hint: 5 rzędów to 40 ołówków. Dodaj jeszcze 2 rzędy.
    pic: Dziecko gra na tablecie, rodzic jest obok. Linijka trzyma żółtą karteczkę z podpowiedzią.
  record:
    counts:
      - { value: 8, label: pytań }
      - { value: 5, label: od razu }
      - { value: 3, label: z podpowiedzią }
    nextLabel: "Następna lekcja:"
    next: mnożenie przez 7 z rozkładem na 5 i 2.
# /jadwigo-ai (dl-w0b4.114; owner's call of 2026-11-02, draft for the native review). Like the rest of the
# site, it makes no claim about models either way (dl-w0b4.79, dl-w0b4.116): the consent screen in the app
# and the privacy page say the rest. Jadwigo AI's lines carry no person and no gender.
ai:
  title: "Jadwigo AI: lekcja ułożona z Twojego zdjęcia albo opisu"
  description: Jadwigo AI czyta, co dziecko ćwiczy w szkole, szuka pytań w banku zadań i układa lekcję. Zanim trafi do dziecka, sprawdzasz ją Ty.
  heading: Jadwigo AI
  intro: Jadwigo AI układa lekcję ze zdjęcia, które wyślesz, albo z tego, co napiszesz. Pytania bierze z banku zadań, każde ze źródłem. Gotową lekcję najpierw widzisz Ty, a dziecko dostaje ją dopiero wtedy, gdy mu ją dasz.
  steps:
    - title: Czyta zadanie
      text: Wysyłasz zdjęcie pracy domowej. Możesz też napisać zwykłymi słowami, co dziecko ćwiczy w szkole, na przykład „Zadania o wydawaniu reszty. Myli złote z groszami”. Jadwigo AI czyta też to, co Jadwigo już wie o dziecku, czyli klasę, cele i pomyłki z ostatnich lekcji.
    - title: Szuka w banku zadań
      text: Szuka pytań, które pasują do Twojej prośby i do tego, co dziecko już umie. Każde pytanie ma podane źródło, na przykład Alfik Matematyczny albo Khan Academy.
    - title: Układa i sprawdza lekcję
      text: Układa pytania od łatwiejszych do trudniejszych i dopisuje podpowiedzi tam, gdzie ich brakuje. Potem sprawdza, czy każda odpowiedź się zgadza i czy każde zdanie dla dziecka jest krótkie i życzliwe.
    - title: Ty decydujesz
      text: Widzisz całą lekcję, pytanie po pytaniu. Możesz zmienić pytanie, poprosić o inne albo je usunąć. Do dziecka trafia tylko to, co mu dasz.
  data:
    heading: Co Jadwigo AI czyta o dziecku i dokąd to trafia
    items:
      - "Jadwigo AI czyta to, czego potrzebuje Twoja prośba: dane dziecka, imiona też."
      - Zapis rozmów zostaje przy koncie rodziny, dopóki konto nie zostanie usunięte. Zarchiwizowana rozmowa też.
      - Imienia dziecka nie ma w lekcji, którą dziecko dostaje.
    # The privacy page is linked after `text` (dl-w0b4.116).
    more:
      text: "Aplikacja mówi to raz, przed Twoją pierwszą wiadomością do Jadwigo AI. Więcej o danych:"
      link: Prywatność
  never:
    heading: Czego Jadwigo AI nie robi
    items:
      - title: Nie rozmawia z dzieckiem
        text: Dziecko widzi tylko lekcję, czyli pytania, podpowiedzi i swoje odpowiedzi. Z Jadwigo AI rozmawiasz tylko Ty.
      - title: Nie daje dziecku niczego bez Ciebie
        text: Lekcja czeka u Ciebie, dopóki jej nie sprawdzisz i nie dasz dziecku.
      - title: Nie ocenia dziecka
        text: Nie daje punktów ani poziomów i nie porównuje dziecka z innymi dziećmi. Mówi, co poszło dobrze i co ćwiczyć dalej.
  check:
    heading: Najpierw sprawdzasz, potem dajesz
    text: Jadwigo AI przygotowuje lekcję, a decyzja należy do Ciebie. Przeglądasz pytania, poprawiasz to, co nie pasuje, i dopiero wtedy dajesz lekcję dziecku.
    wrong: Jadwigo AI może się pomylić. Dlatego ostatnie słowo masz Ty.
  # The line under the landing page's lessons and under /jak-to-dziala's intro that links this page.
  teaser:
    text: Lekcję z Twojego zdjęcia albo opisu układa Jadwigo AI.
    link: Co robi Jadwigo AI
promises:
  heading: Co dostajecie
  items:
    - title: Lekcja z jednego zdjęcia
      text: Wyślij zdjęcie pracy domowej. Po kilku minutach czeka lekcja ułożona dla Twojego dziecka.
    - title: Zadania ze źródłem
      text: Z Alfika Matematycznego i Khan Academy, zawsze z podanym źródłem.
    - title: 29 typów pytań
      text: Jadwigo wybiera to, co pasuje do dziecka, więc Ty nie musisz.
    - title: Na ekranie albo na kartce
      text: Jeden link bez logowania albo wydruk. Bez punktów, minutników i rankingów.
# Direction 1a (owner, 2026-11-01; draft). Its story shows Tymek, a made-up child, never a real learner.
partner:
  heading: Nauka, przy której jesteś blisko
  text: Dziecko ćwiczy w swoim tempie. Na stronie dziecka widzisz każdy cel, a przy nim to, co już umie, nad czym pracuje i co dalej.
  pic: "Z doniczki na kredki wyrasta kiełek szybciej, niż dwór nadąża: Jadwiga podlewa go, stojąc na Linijce, Gumka ją przytrzymuje, a Ołówek zaznacza nową wysokość."
  # Tymek's short story beside it (dl-w0b4.143; draft), replacing the screenshot of Marta's page. Tymek is
  # a made-up child from the demo film. The labels are the app's own (packages/copy parent_goal_*,
  # parent_new_lesson_child, parent_child_grade); the skills are catalogue skills (row-2/5/10 and row-7,
  # II.3.3; clock-five-minutes, II.6.4). The sheet is 7 × 9 split into 7 × 5 and 7 × 4.
  story:
    alt: "Animacja: Tymek, wymyślony uczeń, siedzi z tatą przy stole. Strona Tymka w Jadwigo pokazuje, co już umie, nad czym pracuje i co dalej. Tata wybiera Nowa lekcja i na stół trafia kartka: 7 × 9 rozłożone na 35 i 28. Tymek ją rozwiązuje."
    name: Tymek
    grade: 2 kl.
    button: Nowa lekcja · Tymek
    lists:
      - { label: Umie już, item: "Mnoży przez 2, 5 i 10." }
      - { label: Nad czym pracujemy, item: Mnoży przez 7. }
      - { label: Co dalej, item: Odczytuje godziny na zegarze. }
end:
  text: Konto zakłada rodzic
  button: Załóż konto
lessons:
  title: Lekcje na start · Jadwigo
  description: Krótkie lekcje matematyki i polskiego dla klas 1–3. Bez logowania, od razu w przeglądarce.
  heading: Lekcje na start
  text: Bez logowania. Kliknij i grajcie.
  empty: Pierwsze lekcje po polsku pojawią się tu wkrótce.
  play: Zagraj
  all: Wszystkie lekcje
  # A card's labels: the subject, "klasa 2", and the question count in its 3 Polish forms (1, 2–4, 5+).
  subjects: { math: Matematyka, polish: Polski, english: Angielski }
  grade: klasa
  questions: [pytanie, pytania, pytań]
  # /lekcje's heading over the lessons that have no grade yet.
  other: Inne lekcje
  row:
    heading: Zagraj bez logowania
    # Under the heading, to the parent (dl-w0b4.123; draft).
    text: Daj dziecku jedną z tych lekcji. Otwiera się od razu w przeglądarce, bez konta.
    gradeLabel: Klasa
    pic: ilustracja
    pics:
      cukier: Jadwiga zdejmuje kostkę cukru z wieży, a Gumka mdleje z wrażenia.
      nalesnik: Linijka sprawdza naleśnik pokrojony na cztery równe części, a Jadwiga trzyma ćwiartkę jak tarczę.
      skoki: Linijka leży jak oś liczbowa, a Jadwiga skacze po niej od kreski do kreski.
      mierzenie: Linijka mierzy Ołówka, któremu właśnie odpadł czubek, a Jadwiga czeka na swoją kolej.
      czekolada: Jadwiga dzieli tabliczkę czekolady i podaje Gumce cały rząd kostek.
      spacer: Jadwiga ziewa i obchodzi brzeg zamalowanego prostokąta w zeszycie w kratkę.
      pl3_czytanie: Jadwiga i Gumka chronią się przed deszczem pod otwartą książką, a obok pływa papierowa łódka.
      pl3_gloski: Jadwiga klaszcze, a Ołówek układa okrągłe bąbelki w równym rzędzie.
      pl3_czesci_mowy: Gumka, Linijka i Ołówek wspólnie porządkują puste karty w trzech przegródkach piórnika.
      pl3_zdanie: Gumka i Linijka ustawiają klocki w równym rzędzie, a Ołówek kładzie na końcu okrągły kamyk.
      pl3_ortografia: Jadwiga wysyła pocztówkę, a Gumka troskliwie usuwa z niej małą smugę.
signIn:
  title: Zaloguj się · Jadwigo
  description: Zaloguj się albo załóż konto rodzica w Jadwigo kodem z e-maila, przez Google albo przez Facebooka.
  heading: Zaloguj się
  lead: Konto zakłada rodzic. Logowanie i zakładanie konta to ten sam krok, więc jeśli nie masz jeszcze konta, powstanie od razu.
  email: Twój e-mail
  send: Wyślij kod
  note: Wyślemy kod z 6 cyfr. Wpiszesz go na następnej stronie.
  or: albo
  google: Kontynuuj z Google
  facebook: Kontynuuj z Facebookiem
# From docs/drops/identity/compare.md, each row with its source. Never "Duolingo charges for
# mistakes", and never "no other app": both are out of public copy.
compare:
  heading: Czym różni się Jadwigo
  title: Jadwigo a Khan Academy, Duolingo, Kahoot i Quizlet
  description: Czym Jadwigo różni się od Khan Academy, Duolingo, Kahoota i Quizletu, z linkiem do źródła przy każdej aplikacji.
  text: Każda z tych aplikacji jest zbudowana wokół czegoś innego niż jedno dziecko i jego rodzic.
  columns: [Aplikacja, Zbudowana wokół, Jadwigo]
  source: źródło
  rows:
    - app: Khan Academy
      around: wspólnego kursu, który dziecko przerabia we własnym tempie, czasem z zadaniami od nauczyciela
      jadwigo: układa lekcję z celów tego dziecka i z jego ostatniej lekcji
      source: https://support.khanacademy.org/hc/en-us/articles/360030753412
    - app: Duolingo
      around: codziennego nawyku, serii dni i punktów. W darmowym planie każde ćwiczenie zużywa energię, a płatny plan znosi limit
      jadwigo: bez serii, punktów i limitów. Dziecko kończy, kiedy powie, że na dziś wystarczy
      source: https://www.sec.gov/Archives/edgar/data/1562088/000156208825000165/q2fy25duolingo6-30x25share.htm
    - app: Kahoot
      around: quizu, w który cała grupa gra naraz
      jadwigo: jedno dziecko i wiele rodzajów zadań
      source: https://onlineteachinghub.education.purdue.edu/kahoot
    - app: Quizlet
      around: zestawów do nauki, często zadanych przez nauczyciela całej klasie
      jadwigo: cele wybrane przez rodzica, połączone w jednej lekcji
      source: https://help.quizlet.com/hc/en-au/articles/39836814088845-Using-Assignments
