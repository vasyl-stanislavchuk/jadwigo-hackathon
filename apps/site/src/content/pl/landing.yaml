        - { name: Rz po spółgłoskach, state: now }
        - { name: Ż wymienne na g, z, s, state: next }
        - { name: Wyrazy do zapamiętania, state: next }
  nextLabel: "Następna lekcja:"
  next: reszta z groszami i rz po spółgłoskach, w jednej lekcji.
end:
