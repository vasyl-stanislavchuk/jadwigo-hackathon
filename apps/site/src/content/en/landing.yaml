# /en/how-it-works in direction 1a (design handoff "landing 3", 2026-11-01; draft), in US English.
steps:
  title: How Jadwigo works
  description: Show Jadwigo the homework or write what your child is learning. Your child plays a short lesson, and you see where to help.
  heading: How it works
  intro: You don't need to sit beside your child for the whole lesson. A few minutes are enough to know what they can do and where they struggle.
  pic: Jadwiga opens a huge notebook while Gumka, Ołówek and Linijka get the table ready.
  items:
    - who: You
      title: Show what your child is learning
      text: Send a photo of the homework, or write where your child gets stuck. Jadwigo builds a short lesson from it.
    - who: Your child
      title: Your child plays the lesson
      text: On a tablet or a computer, or printed on paper. A hint is there when they need it, and they can stop when they've had enough.
    - who: You
      title: You see where to help
      text: You see every question, every try and every mistake in plain words. Jadwigo builds the next lesson from what was hard. When you want to sit down with your child, Jadwigo suggests where to start.
  request:
    ask: Making change, like in the workbook. Mixes up dollars and cents.
    lines: [Looking for change questions with cents…, Checking the lesson…, Ready]
    screencast: screencast · the parent types in the chat, the lesson builds on the right, “Show my child”
  card:
    say: A ticket costs $4.50. You pay $10. How much change?
    choices: ["$5.50", "$6.50", "$5"]
    hint: From $4.50 to $5 is 50 cents. How much from $5 to $10?
    pic: The child plays on a tablet with the parent nearby. Linijka holds up a yellow help note.
  record:
    counts:
      - { value: 8, label: questions }
      - { value: 5, label: on the first try }
      - { value: 3, label: with a hint }
    nextLabel: "Next lesson:"
    next: counting up to the next dollar, then change from $20.
    screencast: "screencast · the child's page: goals, skills, the last lesson question by question"
# /en/jadwigo-ai (dl-w0b4.114; owner's call of 2026-11-02, draft), the twin of pl's ai. Like the rest of the
# site, it makes no claim about models either way (dl-w0b4.79, dl-w0b4.116): the consent screen in the app
# and the privacy page say the rest. Jadwigo AI's lines carry no person and no gender.
ai:
  title: "Jadwigo AI: a lesson built from your photo or your words"
  description: Jadwigo AI reads what your child practices at school, finds questions in the question bank and builds a lesson. You check it before your child sees it.
  heading: Jadwigo AI
  intro: Jadwigo AI builds a lesson from a photo you send or from what you write. It takes its questions from the question bank, each with its source. You see the finished lesson first, and your child gets it only when you give it to them.
  steps:
    - title: Reads your request
      text: You send a photo of the homework. You can also write in plain words what your child practices at school, for example “Making change, like in the workbook. Mixes up dollars and cents.” Jadwigo AI also reads what Jadwigo already knows about your child, such as their grade, their goals and the mistakes from recent lessons.
    - title: Searches the question bank
      text: It looks for questions that fit your request and what your child can already do. Every question names its source, such as Alfik Matematyczny or Khan Academy.
    - title: Builds and checks the lesson
      text: It puts the questions in order from easier to harder and writes hints where a question has none. Then it checks that every answer is right and that every line your child reads is short and kind.
    - title: You decide
      text: You see the whole lesson, question by question. You can change a question, ask for a different one or take it out. Your child gets only what you give them.
  data:
    heading: What Jadwigo AI reads about your child, and where it goes
    items:
      - "Jadwigo AI reads what your request needs: your child's data, names included."
      - The record of your conversations stays with your family's account until the account is deleted. An archived conversation does too.
      - Your child's name is never in the lesson your child gets.
    # The privacy page is linked after `text` (dl-w0b4.116).
    more:
      text: "The app says this once, before your first message to Jadwigo AI. More about your data:"
      link: Privacy
  never:
    heading: What Jadwigo AI never does
    items:
      - title: It never talks to your child
        text: Your child sees only the lesson, meaning the questions, the hints and their own answers. Only you talk to Jadwigo AI.
      - title: It never gives your child anything without you
        text: The lesson waits with you until you check it and give it to your child.
      - title: It never grades your child
        text: It gives no points or levels and never compares your child with other children. It tells you what went well and what to practice next.
  check:
    heading: You check it, then you give it
    text: Jadwigo AI prepares the lesson, and the decision is yours. You look through the questions, fix what doesn't fit, and only then give the lesson to your child.
    wrong: Jadwigo AI can make mistakes. That's why the last word is yours.
  # The line under the landing page's lessons and under /en/how-it-works's intro that links this page.
  teaser:
    text: Jadwigo AI builds the lesson from your photo or your words.
    link: What Jadwigo AI does
promises:
  heading: What you get
  items:
    - title: No points, timers or leaderboards
      text: Your child learns at their own pace. Nobody rushes them.
    - title: Every question has a source
      text: From Alfik Matematyczny and Khan Academy, always with the source named.
    - title: Print it, and Jadwigo checks the photo
      text: Print any lesson for your child. Take a photo of the finished work or the homework, and Jadwigo checks it.
# Direction 1a (draft). Its story shows Tymek, a made-up child, never a real learner.
