# Written in US English (decision draft dl-rok6), checked against workflows/_lang/en/checklist.md.
# Copy says what Jadwigo does, never a slogan; numbers are digits.
hero:
  # Beside the h1 (owner, 2026-11-02: less text on top; dl-5ssh.4.46): the alt text of the table picture (dl-5ssh.4.48).
  pic: A parent and child over a homework notebook, with little Jadwiga and her pencil-case court beside them.
  # A grade 3 two-step word problem (design handoff "landing 3", 2026-11-01; draft).
  question:
    label: Two steps · grade 3 · question 1
    say: Zoja has 3 packs of 12 crayons. She gives 9 crayons to her friends. How many crayons does she have left?
    # Each `pic` is its picture's alt text (dl-5ssh.4.24); the pictures are in src/lib/illustrations.ts.
    pic: Little Queen Jadwiga carries a crayon bigger than herself on her shoulder, her crown slipping over one eye.
    source: "Source: Alfik Matematyczny"
    choices: ["27", "36", "45"]
    answer: "27"
    right: Well done! 3 times 12 is 36, and 36 − 9 = 27.
    hint: Almost. First count all the crayons, 3 times 12. Then take away the 9 she gave. Try again.
    signUp:
      text: Every lesson works like this. Create a parent account, and Jadwigo builds every new lesson from the one before.
      button: Create an account
      again: Play the question again
