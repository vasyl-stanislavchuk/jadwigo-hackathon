# The site's English words beyond each page's frontmatter (src/lib/landing.ts), the same shape as
# pl/landing.yaml. Drafted in English, not translated word for word (wave dl-9t2o-1, lead decision 6);
# en/index.md's reviewed: true covers them: the English AI reviewer passed every line (dl-w0b4.84).
# Written in US English (decision draft dl-rok6), checked against workflows/_lang/en/checklist.md.
# Copy says what Jadwigo does, never a slogan; numbers are digits.
hero:
  # Beside the h1 (owner, 2026-11-02: less text on top; dl-5ssh.4.46): the alt text of the table picture (dl-5ssh.4.48).
  pic: A parent and child over a homework notebook, with little Jadwiga and her pencil-case court beside them.
  # A grade 3 two-step word problem (design handoff "landing 3", 2026-11-01; draft).
  question:
    label: Two steps · grade 3 · question 1
    say: Zoja has 3 packs of 12 crayons. She gives 9 crayons to her friends. How many crayons does she have left?
    # Each `pic` is its picture's alt text (dl-5ssh.4.24); the pictures are in src/lib/illustrations.ts.
    pic: Little Queen Jadwiga carries a crayon bigger than herself on her shoulder, her crown slipping over one eye.
    source: "Source: Alfik Matematyczny"
    choices: ["27", "36", "45"]
    answer: "27"
    right: Well done! 3 times 12 is 36, and 36 − 9 = 27.
    hint: Almost. First count all the crayons, 3 times 12. Then take away the 9 she gave. Try again.
    signUp:
      text: Every lesson works like this. Create a parent account, and Jadwigo builds every new lesson from the one before.
      button: Create an account
      again: Play the question again
# Under the lessons, one line for the parent.
after:
  text: What your child found hard, and what needs more attention.
# Every page in the header, in order, each its own page.
links:
  - { href: /en/lessons, label: Lessons }
  - { href: /en/how-it-works, label: How it works }
  - { href: /en/compare, label: Compare }
  - { href: /en/jadwigo-ai, label: Jadwigo AI }
  - { href: /en/about, label: About us }
# /en/how-it-works in direction 1a (design handoff "landing 3", 2026-11-01; draft), in US English.
steps:
  title: How Jadwigo works
  description: Show Jadwigo the homework or write what your child is learning. Your child plays a short lesson, and you see where to help.
  heading: How it works
  intro: You don't need to sit beside your child for the whole lesson. A few minutes are enough to know what they can do and where they struggle.
  pic: Jadwiga opens a huge notebook while Gumka, Ołówek and Linijka get the table ready.
  items:
    - who: You
      title: Show what your child is learning
      text: Send a photo of the homework, or write where your child gets stuck. Jadwigo builds a short lesson from it.
    - who: Your child
      title: Your child plays the lesson
      text: On a tablet or a computer, or printed on paper. A hint is there when they need it, and they can stop when they've had enough.
    - who: You
      title: You see where to help
      text: "On your child's page you see what they can do now, what they're working on and what comes next, with every question and every try in plain words. Jadwigo builds the next lesson from what was hard."
  request:
    ask: Multiplication homework. Mixes up 7 × 8 and 6 × 9.
    lines: [Reading the homework…, Looking for questions on 7 × 8 and 6 × 9…, Checking the lesson…, Ready]
    screencast: "Screencast: a parent adds a photo of the homework and asks for a lesson. The lesson arrives in the chat, ready to give to the child."
  card:
    say: A box holds 7 rows of 8 pencils. How many pencils are in the box?
    choices: ["54", "56", "64"]
    hint: 5 rows are 40 pencils. Add 2 more rows.
    pic: The child plays on a tablet with the parent nearby. Linijka holds up a yellow help note.
  record:
    counts:
      - { value: 8, label: questions }
      - { value: 5, label: on the first try }
      - { value: 3, label: with a hint }
    nextLabel: "Next lesson:"
    next: multiplying by 7 by splitting it into 5 and 2.
# /en/jadwigo-ai (dl-w0b4.114; owner's call of 2026-11-02, draft), the twin of pl's ai. Like the rest of the
# site, it makes no claim about models either way (dl-w0b4.79, dl-w0b4.116): the consent screen in the app
# and the privacy page say the rest. Jadwigo AI's lines carry no person and no gender.
ai:
  title: "Jadwigo AI: a lesson from a photo of the homework, here or in your own AI app"
  description: Send a photo of the homework that went badly. Jadwigo AI builds a lesson for your child, in Jadwigo or in the AI app you already use. You check it before your child sees it.
  heading: Jadwigo AI
  intro: You have no time tonight, and the homework didn't go well. Take a photo of the part that was hard and ask for help. A few minutes later, a lesson made for your child is waiting for you, in Jadwigo or in the AI app you already use.
  connectLink: Connect your AI app
  # The picture beside the intro: a short conversation with a made-up child. Drawn in HTML, so these
  # words follow the language. `alt` tells the whole picture.
  chat:
    alt: "A chat window with the Queen and her pencil-case court standing on top of it. A parent sends a photo of Tymek's marked math homework and asks what he got wrong. The app answers that he got 38 of 42 right, lists the 4 facts to fix, and proposes a lesson. The parent says yes and gets Tymek's play link."
    caption: An example with a made-up child, Tymek.
    step: Message
    ask: This is Tymek's math homework from today, marked by his teacher. Can you see what he got wrong? Make him a short lesson on just that.
    found: "Tymek got 38 of 42 right. The 4 to fix:"
    columns: [Multiplication, Division]
    rows:
      - ["7 × 8 = 56", "56 ÷ 7 = 8"]
      - ["6 × 9 = 54", "54 ÷ 9 = 6"]
    note: He got 6 × 9 right elsewhere on the page, so that one may be a slip. The lesson practices these facts and checking division with multiplication.
    yes: Yes, give it to Tymek.
    lesson:
      title: Multiplying and dividing by 7 and 9
      meta: 8 questions, about 5 minutes
      link: "Tymek's link:"
      url: app.jadwigo.pl/play/…
  features:
    heading: What you get
    items:
      - title: A lesson from one photo
        text: Send a photo, a screenshot or a PDF of the homework. Jadwigo AI works out the topic and builds a lesson for this one child, with at most 20 questions. It takes a few minutes.
      - title: Questions from a proven bank
        text: Jadwigo AI takes questions from the question bank first and writes only what the bank lacks. Every question names its source, such as Alfik Matematyczny or Khan Academy.
      - title: 29 question types
        text: Clocks, number lines, coins, shapes and written answers are some of them. Jadwigo AI chooses what fits, so you never have to pick one.
      - title: A link or a sheet of paper
        text: Your child opens one link and starts, with no login and nothing to install. Or you print the lesson for quiet work on paper, with no screen and no points.
    # The picture for the question types: 29 tiles and this label.
    types: question types
    link: One link
    paper: One sheet
  how:
    heading: How it works
    text: Agents do the work. You and your child get the time. In our pictures, the agents are the Queen and her pencil-case court.
  steps:
    - title: Jadwiga reads
      text: She reads your photo or your words, and what Jadwigo already knows about your child. Then she looks for questions in the bank.
    - title: Ołówek writes
      text: The pencil writes only what the bank lacks, such as a missing question or a hint where a question has none.
    - title: Gumka checks
      text: The eraser checks that every answer is right and that every line your child reads is short and kind.
    - title: Linijka measures
      text: "The ruler measures the lesson against your child: what they can already do, easier to harder, at most 20 questions."
  connect:
    heading: In your own AI app
    text: Jadwigo can live in ChatGPT, Claude or Muse. You connect it once, then ask for lessons there without opening Jadwigo. You need a Jadwigo account, and you sign in to it once, when you connect.
    urlLabel: The address to add
    copy: Copy
    copied: Copied
    clientsLabel: Your AI app
    clients:
      - name: ChatGPT
        steps:
          - In ChatGPT, open Settings, then Apps and connectors.
          - Add a new connector. Name it Jadwigo and paste the address above.
      - name: Claude
        steps:
          - In Claude, open Settings, then Connectors.
          - Choose Add custom connector. Name it Jadwigo and paste the address above.
      - name: Muse
        steps:
          - In Muse, open the settings for MCP servers.
          - Add a remote server. Name it Jadwigo and paste the address above.
    after:
      - Sign in to Jadwigo and approve. The page you approve on names the app your family's data goes to.
      - Give the app a photo or a screenshot of the homework and ask for a lesson.
      - Read the lesson in the chat. When you say yes, the app gives you your child's play link.
    docs:
      text: "More about the connection:"
      link: Connect your AI
  data:
    heading: What Jadwigo AI reads about your child, and where it goes
    items:
      - "Jadwigo AI reads what your request needs: your child's data, names included."
      - In your own AI app, your family's data, names included, goes to the app you connected.
      - The record of your conversations stays with your family's account until the account is deleted. An archived conversation does too.
      - Your child's name is never in the lesson your child gets.
    # The privacy page is linked after `text` (dl-w0b4.116).
    more:
      text: "The app says this once, before your first message to Jadwigo AI. More about your data:"
      link: Privacy
  never:
    heading: What Jadwigo AI never does
    items:
      - title: It never talks to your child
        text: Your child sees only the lesson, meaning the questions, the hints and their own answers. Only you talk to Jadwigo AI.
      - title: It never gives your child anything without you
        text: The lesson waits with you until you check it and give it to your child.
      - title: It never grades your child
        text: It gives no points or levels and never compares your child with other children. It tells you what went well and what to practice next.
  check:
    heading: You check it, then you give it
    text: You see the whole lesson, question by question. You can change a question, ask for a different one or take it out. Your child gets only what you give them. In your own AI app, your yes in the chat is what gives the lesson.
    wrong: Jadwigo AI can make mistakes. That's why the last word is yours.
  # The line under the landing page's lessons and under /en/how-it-works's intro that links this page.
  teaser:
    text: Jadwigo AI builds the lesson from your photo or your words.
    link: What Jadwigo AI does
promises:
  heading: What you get
  items:
    - title: A lesson from one photo
      text: Send a photo of the homework. A few minutes later, a lesson made for your child is waiting.
    - title: Every question has a source
      text: From Alfik Matematyczny and Khan Academy, always with the source named.
    - title: 29 question types
      text: Jadwigo chooses what fits your child, so you never have to pick.
    - title: On a screen or on paper
      text: One link with no login, or a printed sheet. No points, timers or leaderboards.
# Direction 1a (draft). Its story shows Tymek, a made-up child, never a real learner.
partner:
  heading: Learning with you close by
  text: Your child practices at their own pace. On your child's page you see each goal, with what they can do now, what they're working on and what comes next.
  pic: "A sprout grows out of the pencil pot faster than the court can keep up: Jadwiga waters it from the top of Linijka, Gumka holds her steady and Ołówek marks the new height."
  # Tymek's short story beside it (dl-w0b4.143; draft), replacing the screenshot of Marta's page. Tymek is
  # a made-up child from the demo film. The labels are the app's own (packages/copy parent_goal_*,
  # parent_new_lesson_child, parent_child_grade).
  story:
    alt: "Animation: Tymek, a made-up learner, sits at the table with his dad. Tymek's page in Jadwigo shows what he can do now, what he's working on and what comes next. His dad picks New lesson, and a sheet lands on the table: 7 × 9 split into 35 and 28. Tymek works it out."
    name: Tymek
    grade: Year 2
    button: New lesson · Tymek
    lists:
      - { label: Can do now, item: "Multiplies by 2, 5 and 10." }
      - { label: Working on, item: Multiplies by 7. }
      - { label: What comes next, item: Reads the time on a clock. }
end:
  text: A parent creates the account
  button: Create an account
lessons:
  title: Lessons to start with · Jadwigo
  description: Short math and Polish lessons for grades 1–3. No sign-in, right in the browser.
  heading: Lessons to start with
  text: No sign-in. Click and play.
  empty: The first English lessons are coming soon.
  play: Play
  all: All lessons
  # A card's labels: the subject, "Grade 2", and the question count (1 question, 2 questions).
  subjects: { math: Math, polish: Polish, english: English }
  grade: Grade
  questions: [question, questions, questions]
  # /lekcje's heading over the lessons that have no grade yet.
  other: More lessons
  row:
    heading: Play without signing in
    # Under the heading, to the parent (dl-w0b4.123; draft).
    text: Give your child one of these lessons. It opens right in the browser, with no account needed.
    gradeLabel: Grade
    pic: illustration
    pics:
      cukier: Jadwiga lifts a sugar cube off a tower while Gumka the eraser faints.
      nalesnik: Linijka the ruler checks a pancake cut into four equal parts while Jadwiga holds a quarter like a shield.
      skoki: Linijka the ruler lies flat like a number line and Jadwiga hops along it, mark to mark.
      mierzenie: Linijka the ruler measures Ołówek the pencil just as his tip snaps, and Jadwiga waits her turn.
      czekolada: Jadwiga shares a chocolate bar, handing Gumka the eraser a whole row of squares.
      spacer: Jadwiga yawns as she walks round the edge of a shaded rectangle in a squared notebook.
      pl3_czytanie: Jadwiga and Gumka shelter from the rain beneath an open book, with a paper boat floating beside them.
      pl3_gloski: Jadwiga claps while Ołówek arranges round bubbles in a neat row.
      pl3_czesci_mowy: Gumka, Linijka and Ołówek sort blank cards into three pencil-case compartments together.
      pl3_zdanie: Gumka and Linijka straighten a row of blocks while Ołówek places a round pebble at the end.
      pl3_ortografia: Jadwiga posts a postcard while Gumka carefully removes a small smudge.
signIn:
  title: Sign in · Jadwigo
  description: Sign in or create a Jadwigo parent account with a code from your email, with Google or with Facebook.
  heading: Sign in
  lead: A parent creates the account. Signing in and signing up are the same step, so if you don't have an account yet, we create one right away.
  email: Your email
  send: Send the code
  note: We'll send a 6-digit code. You type it on the next page.
  or: or
  google: Continue with Google
  facebook: Continue with Facebook
# From docs/drops/identity/compare.md, each row with its source. Never "Duolingo charges for
# mistakes", and never "no other app": both are out of public copy.
compare:
  heading: How Jadwigo is different
  title: Jadwigo next to Khan Academy, Duolingo, Kahoot and Quizlet
  description: How Jadwigo differs from Khan Academy, Duolingo, Kahoot and Quizlet, with a link to the source for each app.
  text: Each of these apps is built around something other than one child and their parent.
  columns: [App, Built around, Jadwigo]
  source: source
  rows:
    - app: Khan Academy
      around: a shared course a child works through at their own pace, sometimes with tasks from a teacher
      jadwigo: builds the lesson from this child's goals and their last lesson
      source: https://support.khanacademy.org/hc/en-us/articles/360030753412
    - app: Duolingo
      around: a daily habit, streaks and points. On the free plan each exercise uses up energy, and the paid plan lifts the limit
      jadwigo: no streaks, points or limits. Your child stops when they say that's enough for today
      source: https://www.sec.gov/Archives/edgar/data/1562088/000156208825000165/q2fy25duolingo6-30x25share.htm
    - app: Kahoot
      around: a quiz a whole group plays at once
      jadwigo: one child and many kinds of questions
      source: https://onlineteachinghub.education.purdue.edu/kahoot
    - app: Quizlet
      around: study sets, often set by a teacher for the whole class
      jadwigo: goals a parent picks, joined in one lesson
      source: https://help.quizlet.com/hc/en-au/articles/39836814088845-Using-Assignments
