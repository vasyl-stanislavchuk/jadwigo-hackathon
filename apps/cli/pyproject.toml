[project]
name = "jw"
version = "0.0.1"
description = "jw, the jadwigo CLI (dl-5ssh.34.7 fills it), and later jw mcp serve"
requires-python = ">=3.12"
dependencies = [
  "click==8.3.1", # the command tree (src/jw/cli.py)
]

[project.scripts]
jw = "jw.cli:main"

[dependency-groups]
dev = [
  "pytest==9.0.2", # the tests in tests/
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
