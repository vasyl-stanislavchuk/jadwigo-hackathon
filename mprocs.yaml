# `make dev-all`: every dev server in one terminal, one pane each (mprocs, run as `dekit mprocs`;
# mise.toml pins it). Each process also logs to .logs/dev/<name>.log, so an agent can read what a
# pane shows. Keys: arrows pick a pane, s starts, x stops, r restarts, q quits all.
# The ports and the database come from `make dev-all` (md's ports in a worktree, the local jadwigo db).
procs:
  web:
    shell: "bun run --cwd apps/web dev"
  api:
    shell: "bun run --cwd apps/api dev"
  copy:
    shell: "bun run --cwd packages/copy dev"
  # The parent's sign-in on this machine: the stand-in for Supabase Auth (make dev-all, dl-5ssh.131).
  # Any email and 123456; web and api point at it unless DEV_AUTH=supabase. On the same port, the
  # stand-in for Realtime: the run channel, its join checked by the run_join policy, and the
  # broadcasts realtime.send keeps in the local database (dl-uukj.47.14.1).
  auth:
    shell: "bun apps/web/e2e/realtime-server.ts"
  # The step host, as the runner Lambda: drains agent_step as jadwigo_runner when the api pokes
  # LOCAL_RUNNER_URL after a commit, through HttpMuse on prod's model settings (apps/runner/src/dev.ts,
  # dl-uukj.47.14.2). Every turn is a paid Muse call: it starts only with JADWIGO_MUSE_CAP_USD set
  # and META_API_KEY in MUSE_ENV (make dev-all JADWIGO_MUSE_CAP_USD=0.50).
  runner:
    shell: "if [ -f \"$MUSE_ENV\" ]; then set -a; . \"$MUSE_ENV\"; set +a; fi; exec bun run --cwd apps/runner dev --listen \"$LOCAL_RUNNER_URL\""
  # ASTRO_DEV_BACKGROUND set keeps astro dev in its pane: unset, Astro detaches when an agent started
  # it (dev/index.js isRunByAgent), and the server outlives mprocs.
  site:
    shell: "bun run --cwd apps/site dev"
    env:
      ASTRO_DEV_BACKGROUND: "0"
  # The slowest to start (typedoc and the OpenAPI prepare): s to start it.
  docs:
    shell: "bun run --cwd apps/docs dev"
    autostart: false
    env:
      ASTRO_DEV_BACKGROUND: "0"
  # On demand: the gate, and the local database rebuilt after a pull brings migrations.
  check:
    shell: "make check"
    autostart: false
  db-reset:
    shell: "make db-reset ENV="
    autostart: false
