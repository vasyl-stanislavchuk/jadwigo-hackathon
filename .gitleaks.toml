# gitleaks for jadwigo: the default rules (keys, tokens) plus house rules.
# CI runs it on every PR (the gitleaks job under ci-ok), and pre-commit on the staged diff.
title = "jadwigo"

[extend]
useDefault = true

# MISSING: the family-name rule. Learner names must never be committed (fixtures, screenshots,
# transcripts). The owner gives the list of names; until then only the default rules run.
