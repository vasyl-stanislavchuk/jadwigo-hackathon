# The policy md's merge-steward persona reads for this repo (dl-5ssh.34.46). It reviews each ready
# PR on Opus, posts the review-ok commit status, and fixes main forward. No path needs approval:
# david-learns/decisions/2026-10-26-the-merge-steward-is-an-md-persona-that-reviews-on-the-subscript.
# The reviewer prompts are dl-5ssh.34.32. Contract snapshots are never self-fixed: they are a one-way door.
[merge_steward]
base = "main"
ci_workflow = "ci"
required_checks = ["ci-ok"]
review_check = "review-ok"
review_prompts = ".md/merge-steward-review.md"
check_command = "make check"
tracker = "~/projects/david-learns/.beads"
round_cap = 2
# Review fast, decide, merge (dl-5ssh.34.60). No gate waits for the owner: a workflow change gets
# one more reviewer, a large PR is reviewed as it is, and a PR past the round cap goes back to its
# author again. The owner holds one with `md merge-steward ask <pr> "held: ..."` in the tab.
ask_owner = []
size_lines = 0
size_files = 0
# Names a review must never post, such as family names. The file stays outside git, since a
# committed list would publish them; .gitleaks.toml waits on the same list.
private_terms = "~/.config/jadwigo/private-terms.txt"
# The repo is public: md works only on PRs by these authors and the dependency bots below.
authors = ["vasyl-stanislavchuk"]

[merge_steward.self_fix]
commands = ["bunx biome check --write"]
lockfile = "bun install"
generated = [{ paths = [".claude/skills/", ".agents/skills/"], command = "make skills" }]

[merge_steward.dependency_bots]
logins = ["renovate[bot]"]
fast_path = ["patch", "minor"]
